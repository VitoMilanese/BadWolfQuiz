<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020406" />
      <stop offset="0.55" stop-color="#05070b" />
      <stop offset="1" stop-color="#0d0508" />
    </linearGradient>
    <radialGradient id="redMist" cx="50%" cy="47%" r="50%">
      <stop offset="0" stop-color="#c90016" stop-opacity="0.18" />
      <stop offset="0.62" stop-color="#79000e" stop-opacity="0.07" />
      <stop offset="1" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fur" x1="0.22" y1="0.08" x2="0.78" y2="0.94">
      <stop offset="0" stop-color="#292d34" />
      <stop offset="0.38" stop-color="#161a20" />
      <stop offset="0.72" stop-color="#0c0f14" />
      <stop offset="1" stop-color="#05070a" />
    </linearGradient>
    <linearGradient id="furLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b5058" stop-opacity="0.72" />
      <stop offset="1" stop-color="#171b21" stop-opacity="0.12" />
    </linearGradient>
    <linearGradient id="muzzle" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#50545b" />
      <stop offset="0.55" stop-color="#272b31" />
      <stop offset="1" stop-color="#111419" />
    </linearGradient>
    <linearGradient id="fang" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4c9" />
      <stop offset="1" stop-color="#d6b56a" />
    </linearGradient>
    <filter id="wolfShadow" x="-25%" y="-25%" width="150%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20" result="blur" />
      <feOffset dy="20" result="offset" />
      <feComponentTransfer in="offset" result="fade">
        <feFuncA type="linear" slope="0.62" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="fade" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="redGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />
  <ellipse cx="800" cy="430" rx="555" ry="390" fill="url(#redMist)" />

  <g filter="url(#wolfShadow)">
    <!-- Jagged outer silhouette, deliberately wolf-like rather than rounded. -->
    <path d="M800 104
      L738 145 L676 120 L604 170 L482 78 L445 207 L421 333
      L362 390 L421 397 L350 486 L424 478 L360 579 L446 556
      L400 663 L500 622 L472 742 L592 685 L648 804 L729 771
      L800 850
      L871 771 L952 804 L1008 685 L1128 742 L1100 622 L1200 663
      L1154 556 L1240 579 L1176 478 L1250 486 L1179 397 L1238 390
      L1179 333 L1155 207 L1118 78 L996 170 L924 120 L862 145Z"
      fill="#05070a" stroke="#e00019" stroke-width="16" stroke-linejoin="miter" />

    <!-- Ear interiors -->
    <path d="M490 113 L585 184 L468 303 L484 198Z" fill="#171b21" />
    <path d="M1110 113 L1015 184 L1132 303 L1116 198Z" fill="#171b21" />
    <path d="M500 137 L558 183 L486 255" fill="none" stroke="#444951" stroke-width="12" stroke-linecap="round" opacity="0.55" />
    <path d="M1100 137 L1042 183 L1114 255" fill="none" stroke="#444951" stroke-width="12" stroke-linecap="round" opacity="0.55" />

    <!-- Main head mass -->
    <path d="M800 135
      C711 135 626 184 575 252
      C520 322 495 413 507 510
      C519 610 573 695 655 744
      C704 773 753 788 800 801
      C847 788 896 773 945 744
      C1027 695 1081 610 1093 510
      C1105 413 1080 322 1025 252
      C974 184 889 135 800 135Z"
      fill="url(#fur)" />

    <!-- Spiky forehead fur -->
    <path d="M610 246 L674 208 L652 268 L717 220 L702 285 L758 236 L750 302 L800 248
      L850 302 L842 236 L898 285 L883 220 L948 268 L926 208 L990 246
      C928 181 872 150 800 150 C728 150 672 181 610 246Z"
      fill="#10141a" />

    <!-- Temple tufts -->
    <path d="M532 306 L448 345 L511 356 L427 411 L504 407 L442 476 L522 452 L478 528 L564 490Z" fill="#0a0d12" />
    <path d="M1068 306 L1152 345 L1089 356 L1173 411 L1096 407 L1158 476 L1078 452 L1122 528 L1036 490Z" fill="#0a0d12" />

    <!-- Brow ridges / angry expression -->
    <path d="M515 360 C584 302 678 300 744 348 C689 338 620 352 552 403Z" fill="#282d35" />
    <path d="M1085 360 C1016 302 922 300 856 348 C911 338 980 352 1048 403Z" fill="#282d35" />
    <path d="M541 376 C596 343 654 338 710 350 L665 392 C620 386 581 394 548 413Z" fill="#07090d" />
    <path d="M1059 376 C1004 343 946 338 890 350 L935 392 C980 386 1019 394 1052 413Z" fill="#07090d" />

    <!-- Glowing red eyes -->
    <path d="M548 374 C590 351 635 350 684 363 C652 380 620 398 580 407 C566 400 555 389 548 374Z"
      fill="#f10a22" filter="url(#redGlow)" />
    <path d="M1052 374 C1010 351 965 350 916 363 C948 380 980 398 1020 407 C1034 400 1045 389 1052 374Z"
      fill="#f10a22" filter="url(#redGlow)" />
    <path d="M575 375 C603 362 631 361 657 366 C634 376 611 387 588 393Z" fill="#fff3db" />
    <path d="M1025 375 C997 362 969 361 943 366 C966 376 989 387 1012 393Z" fill="#fff3db" />
    <circle cx="616" cy="378" r="7" fill="#fff" />
    <circle cx="984" cy="378" r="7" fill="#fff" />

    <!-- Cheek fur -->
    <path d="M520 430 L598 399 L688 420 L636 467 L700 479 L628 528 L676 548 L588 590 L531 558 L476 501Z"
      fill="#11151b" />
    <path d="M1080 430 L1002 399 L912 420 L964 467 L900 479 L972 528 L924 548 L1012 590 L1069 558 L1124 501Z"
      fill="#11151b" />

    <!-- Muzzle bridge, long and narrow -->
    <path d="M705 392 C734 371 768 360 800 360 C832 360 866 371 895 392
      L912 502 C889 564 852 610 800 643
      C748 610 711 564 688 502Z"
      fill="#252a31" />
    <path d="M739 405 C759 390 779 383 800 383 C821 383 841 390 861 405
      L872 492 C854 537 829 571 800 594
      C771 571 746 537 728 492Z"
      fill="url(#furLight)" />

    <!-- Snout -->
    <path d="M681 497 C714 472 756 460 800 460 C844 460 886 472 919 497
      C907 546 880 596 800 646
      C720 596 693 546 681 497Z"
      fill="url(#muzzle)" />
    <path d="M735 555 C756 538 779 530 800 530 C821 530 844 538 865 555
      C856 587 834 607 800 612 C766 607 744 587 735 555Z"
      fill="#080a0d" />
    <path d="M753 558 C768 549 784 545 800 545 C816 545 832 549 847 558"
      fill="none" stroke="#5f646b" stroke-width="4" stroke-linecap="round" opacity="0.5" />

    <!-- Snarl creases -->
    <path d="M616 518 C658 530 692 548 720 575" fill="none" stroke="#b40018" stroke-width="5" stroke-linecap="round" opacity="0.65" />
    <path d="M984 518 C942 530 908 548 880 575" fill="none" stroke="#b40018" stroke-width="5" stroke-linecap="round" opacity="0.65" />

    <!-- Open mouth -->
    <path d="M671 607
      C714 630 759 642 800 642
      C841 642 886 630 929 607
      C913 688 870 745 800 766
      C730 745 687 688 671 607Z"
      fill="#020304" stroke="#7e0715" stroke-width="5" />
    <path d="M704 629 C737 647 769 655 800 655 C831 655 863 647 896 629"
      fill="none" stroke="#b30a1d" stroke-width="5" stroke-linecap="round" opacity="0.72" />

    <!-- Upper fangs / teeth -->
    <path d="M706 631 L733 639 L728 697 L748 646 L768 651 L758 692 L781 656 L797 659 L790 692
      L810 659 L826 656 L842 692 L832 651 L852 646 L872 697 L867 639 L894 631"
      fill="url(#fang)" />
    <!-- Lower fangs / teeth -->
    <path d="M725 722 L748 714 L758 741 L773 710 L790 715 L800 742 L810 715 L827 710 L842 741 L852 714 L875 722
      C853 742 827 753 800 755 C773 753 747 742 725 722Z"
      fill="url(#fang)" />

    <!-- Chin / lower jaw fur -->
    <path d="M684 744 L728 770 L756 748 L800 808 L844 748 L872 770 L916 744 L886 808 L830 789 L800 834 L770 789 L714 808Z"
      fill="#0a0d12" />

    <!-- Strong red outer fur accents -->
    <path d="M484 86 L447 211 L427 330" fill="none" stroke="#ff071f" stroke-width="7" stroke-linecap="square" />
    <path d="M1116 86 L1153 211 L1173 330" fill="none" stroke="#ff071f" stroke-width="7" stroke-linecap="square" />
    <path d="M405 659 L496 620" fill="none" stroke="#ff071f" stroke-width="7" />
    <path d="M1195 659 L1104 620" fill="none" stroke="#ff071f" stroke-width="7" />
  </g>

  <g fill="#e00019" opacity="0.55">
    <circle cx="260" cy="224" r="3" />
    <circle cx="1320" cy="192" r="2.5" />
    <circle cx="300" cy="684" r="2.5" />
    <circle cx="1260" cy="715" r="3" />
    <rect x="232" y="755" width="150" height="3" />
    <rect x="1218" y="755" width="150" height="3" />
  </g>
</svg>