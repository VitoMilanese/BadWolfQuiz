<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020305" />
      <stop offset="0.55" stop-color="#050609" />
      <stop offset="1" stop-color="#0c0407" />
    </linearGradient>
    <radialGradient id="mist" cx="50%" cy="47%" r="45%">
      <stop offset="0" stop-color="#b90012" stop-opacity="0.18" />
      <stop offset="0.58" stop-color="#6f000b" stop-opacity="0.08" />
      <stop offset="1" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fur" x1="0.18" y1="0.04" x2="0.82" y2="0.98">
