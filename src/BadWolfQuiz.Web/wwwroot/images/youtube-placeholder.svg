<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17181e" />
      <stop offset="0.52" stop-color="#090a0d" />
      <stop offset="1" stop-color="#21070c" />
    </linearGradient>
    <radialGradient id="redGlow" cx="72%" cy="30%" r="48%">
      <stop offset="0" stop-color="#ef233c" stop-opacity="0.3" />
