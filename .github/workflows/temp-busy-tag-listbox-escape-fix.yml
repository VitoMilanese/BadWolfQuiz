name: Temporary capture-phase tag Escape fix

on:
  push:
    branches:
      - feature/tag-editor-bulk-tools

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.event.head_commit.message == 'Run capture-phase Escape fix workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Apply real Escape guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          script_path = Path("src/BadWolfQuiz.Web/wwwroot/js/busy-indicators.js")
          script = script_path.read_text(encoding="utf-8")
          old = '''        if (preview && !preview.hidden) {
              return true;
          }

          return [...document.querySelectorAll("dialog[open]")]'''
          new = '''        if (preview && !preview.hidden) {
              return true;
          }

          if (document.querySelector("[role='listbox']:not([hidden])")) {
              return true;
          }

          return [...document.querySelectorAll("dialog[open]")]'''
          if old not in script:
              raise SystemExit("busy-indicators Escape guard anchor not found")
          script_path.write_text(script.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/BadWolfQuiz.Web.Tests/BusyIndicatorRegressionTests.cs")
          test = test_path.read_text(encoding="utf-8")
          old_test = '''        Assert.Contains("hasOpenEditorModal", script, StringComparison.Ordinal);
              Assert.Contains("runAfterPaint", script, StringComparison.Ordinal);'''
          new_test = '''        Assert.Contains("hasOpenEditorModal", script, StringComparison.Ordinal);
              Assert.Contains("[role='listbox']:not([hidden])", script, StringComparison.Ordinal);
              Assert.Contains("runAfterPaint", script, StringComparison.Ordinal);'''
          if old_test not in test:
              raise SystemExit("BusyIndicatorRegressionTests Escape assertion anchor not found")
          test_path.write_text(test.replace(old_test, new_test, 1), encoding="utf-8")
          PY
      - name: Test game runtime
        run: dotnet test tests/BadWolfQuiz.Game.Tests/BadWolfQuiz.Game.Tests.csproj --configuration Release
      - name: Test web
        run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj --configuration Release
      - name: Append functional fix commit
        shell: bash
        run: |
          git config user.name "Vitalii Hanych"
          git config user.email "64318287+VitoMilanese@users.noreply.github.com"
          git add src/BadWolfQuiz.Web/wwwroot/js/busy-indicators.js tests/BadWolfQuiz.Web.Tests/BusyIndicatorRegressionTests.cs
          git commit -m "Keep tag dropdown Escape inside question editors"
          git push origin HEAD:feature/tag-editor-bulk-tools
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/temp-busy-tag-listbox-escape-fix.yml
          git commit -m "Remove temporary Escape fix workflow"
          git push origin HEAD:feature/tag-editor-bulk-tools
