name: Quiz import export busy CI

on:
  pull_request:
    branches:
      - agent/302-quiz-import-export-busy

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run targeted regression tests
        run: >-
          dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj
          --configuration Release
          --filter "FullyQualifiedName~BoardHeaderLayoutRegressionTests|FullyQualifiedName~HostGameplayNavigationMarkupTests|FullyQualifiedName~RapidGameplaySubmissionRegressionTests|FullyQualifiedName~BusyIndicatorRegressionTests"
