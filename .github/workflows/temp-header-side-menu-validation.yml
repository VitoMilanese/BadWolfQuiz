name: Temporary Header Side Menu Validation

on:
  push:
    branches:
      - agent/redesign-header-side-menu

jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run header side menu regression tests
        run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj --configuration Release --filter FullyQualifiedName~HeaderSideMenuRegressionTests --verbosity minimal
