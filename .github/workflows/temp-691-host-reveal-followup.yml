name: Temporary issue 691 host reveal follow-up

on:
  push:
    branches:
      - feature/691-on-demand-answer-options

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Apply follow-up patch
        run: python3 .github/temp-691-host-reveal-followup.py
      - name: Run focused web tests
        run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj --configuration Release --filter 'FullyQualifiedName~OnDemandAllPlayerChoiceRegressionTests|FullyQualifiedName~MandatoryAllPlayerQuestionRegressionTests'
      - name: Run full web test suite
        run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj --configuration Release
      - name: Commit tested follow-up and remove temporary files
        if: success()
        shell: bash
        run: |
          rm .github/workflows/temp-691-host-reveal-followup.yml
          rm .github/temp-691-host-reveal-followup.py
          git config user.name "Vitalii Hanych"
          git config user.email "64318287+VitoMilanese@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize on-demand choice host transition"
          git push origin HEAD:feature/691-on-demand-answer-options
