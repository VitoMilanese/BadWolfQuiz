name: Temporary issue 691 follow-up validation

on:
  push:
    branches:
      - feature/691-on-demand-answer-options

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Refine on-demand all-player answer reveal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}: {old[:140]!r}')
              write(path, text.replace(old, new, 1))

          def replace_all(path, old, new, minimum=1):
              text = read(path)
              count = text.count(old)
              if count < minimum:
                  raise RuntimeError(f'{path}: expected at least {minimum} matches, found {count}: {old[:140]!r}')
              write(path, text.replace(old, new))

          # Editor: bind the checkbox to the page model and lay it out as the
          # full-width row below the question type selector/help, matching the
          # requested design instead of squeezing it into the label column.
          p = 'src/BadWolfQuiz.Web/Pages/Admin/Quizzes/QuestionEditor.cshtml'
          replace_once(p,
              '    .question-tag-suggestion:hover, .question-tag-suggestion.is-active { background: var(--panel-2); }\n</style>',
              '''    .question-tag-suggestion:hover, .question-tag-suggestion.is-active { background: var(--panel-2); }\n    .question-type-setting .all-player-choice-on-demand-setting {\n        grid-column: 1 / -1;\n        display: flex;\n        align-items: center;\n        gap: 10px;\n        min-width: 0;\n        margin: 0;\n    }\n    .question-type-setting .all-player-choice-on-demand-setting[hidden] {\n        display: none !important;\n    }\n    .question-type-setting .all-player-choice-on-demand-setting > input {\n        flex: 0 0 auto;\n        margin: 0;\n    }\n    .question-type-setting .all-player-choice-on-demand-setting > span {\n        display: flex;\n        align-items: baseline;\n        gap: .35rem;\n        min-width: 0;\n        flex-wrap: wrap;\n    }\n    .question-type-setting .all-player-choice-on-demand-setting > span > small {\n        display: inline;\n        grid-column: auto !important;\n        margin: 0;\n        color: var(--muted);\n    }\n</style>''')
          replace_once(p,
              '            <input type="checkbox" data-all-player-choice-on-demand />',
              '            <input asp-for="Input.RevealAnswerOptionsOnDemand"\n                   data-all-player-choice-on-demand />')

          p = 'src/BadWolfQuiz.Web/Pages/Admin/Quizzes/QuestionEditor.cshtml.cs'
          replace_once(p,
              '            AllPlayerMode = AllPlayerQuestionCompatibility.GetMode(\n                storedPresentationType),\n            ExcludeFromRandomWagerSelection =',
              '            AllPlayerMode = AllPlayerQuestionCompatibility.GetMode(\n                storedPresentationType),\n            RevealAnswerOptionsOnDemand = storedPresentationType ==\n                QuestionPresentationType.AllPlayerMultipleChoiceOnDemand,\n            ExcludeFromRandomWagerSelection =')
          replace_once(p,
              '''    public async Task<IActionResult> OnPostAsync(CancellationToken cancellationToken)\n    {\n        Input.PresentationType =\n            AllPlayerQuestionCompatibility.ResolvePostedPresentationType(\n                Input.PresentationType,\n                Input.AllPlayerMode);\n        var isAllPlayerMultipleChoiceOnDemand =\n            Input.PresentationType ==\n                QuestionPresentationType.AllPlayerMultipleChoiceOnDemand;''',
              '''    public async Task<IActionResult> OnPostAsync(CancellationToken cancellationToken)\n    {\n        Input.AllPlayerMode = Input.PresentationType switch\n        {\n            QuestionPresentationType.AllPlayerText =>\n                AllPlayerQuestionCompatibility.TextMode,\n            QuestionPresentationType.AllPlayerMultipleChoice =>\n                Input.RevealAnswerOptionsOnDemand\n                    ? AllPlayerQuestionCompatibility.MultipleChoiceOnDemandMode\n                    : AllPlayerQuestionCompatibility.MultipleChoiceMode,\n            _ => null\n        };\n        Input.PresentationType =\n            AllPlayerQuestionCompatibility.ResolvePostedPresentationType(\n                Input.PresentationType,\n                Input.AllPlayerMode);\n        var isAllPlayerMultipleChoiceOnDemand =\n            Input.PresentationType ==\n                QuestionPresentationType.AllPlayerMultipleChoiceOnDemand;\n        Input.RevealAnswerOptionsOnDemand =\n            isAllPlayerMultipleChoiceOnDemand;''')
          replace_once(p,
              '        public string? AllPlayerMode { get; set; }\n\n        [Display(Name = "Label_ExcludeFromRandomWagerSelection")]',
              '        public string? AllPlayerMode { get; set; }\n\n        [Display(Name = "Label_AllPlayerChoiceOnDemand")]\n        public bool RevealAnswerOptionsOnDemand { get; set; }\n\n        [Display(Name = "Label_ExcludeFromRandomWagerSelection")]')

          # Editor controller: move the checkbox after the visible type help and
          # update immediately on a native checkbox change. The server binding
          # above remains authoritative even if JavaScript is bypassed.
          p = 'src/BadWolfQuiz.Web/wwwroot/js/multiple-choice-answer-options.js'
          replace_once(p,
              '''        const onDemandCheckbox = document.querySelector(\n            "[data-all-player-choice-on-demand]");\n        if (onDemandCheckbox instanceof HTMLInputElement &&\n            modeInput instanceof HTMLInputElement) {''',
              '''        const onDemandCheckbox = document.querySelector(\n            "[data-all-player-choice-on-demand]");\n        if (onDemandSetting instanceof HTMLElement) {\n            typePanel?.append(onDemandSetting);\n        }\n        if (onDemandCheckbox instanceof HTMLInputElement &&\n            modeInput instanceof HTMLInputElement) {''')
          replace_once(p,
              '        onDemandCheckbox?.addEventListener("change", scheduleSync);',
              '''        if (onDemandCheckbox instanceof HTMLInputElement) {\n            onDemandCheckbox.addEventListener("change", () => {\n                updateQuestionTypeUi();\n                scheduleSync();\n            });\n        }''')

          # Bust the question-editor controller cache.
          p = 'src/BadWolfQuiz.Web/TagHelpers/MultipleChoiceAnswerOptionsAssetsTagHelper.cs'
          replace_all(p, '382.8', '382.9', minimum=2)
          p = 'tests/BadWolfQuiz.Web.Tests/MultipleChoiceEditorStabilityRegressionTests.cs'
          replace_all(p, '382.8', '382.9', minimum=2)

          # Runtime: answer choices may be revealed after buzzer activity. Keep
          # the IDs of everyone who already used the buzzer so they can see the
          # choices but cannot submit one after conversion to all-player mode.
          p = 'src/BadWolfQuiz.Game/Runtime/GameBoard.cs'
          replace_once(p,
              '''    private readonly List<int> _remainingHostMultipleChoiceOptionIds = [];\n    private readonly IReadOnlyList<QuestionAnswerAttempt> _readOnlyAnswerAttempts;\n    private readonly IReadOnlyList<Wager> _readOnlyAllPlayerWagers;\n    private readonly IReadOnlyList<int> _readOnlyRemainingHostMultipleChoiceOptionIds;''',
              '''    private readonly List<int> _remainingHostMultipleChoiceOptionIds = [];\n    private readonly List<GamePlayerId> _allPlayerChoiceExcludedPlayerIds = [];\n    private readonly IReadOnlyList<QuestionAnswerAttempt> _readOnlyAnswerAttempts;\n    private readonly IReadOnlyList<Wager> _readOnlyAllPlayerWagers;\n    private readonly IReadOnlyList<int> _readOnlyRemainingHostMultipleChoiceOptionIds;\n    private readonly IReadOnlyList<GamePlayerId> _readOnlyAllPlayerChoiceExcludedPlayerIds;''')
          replace_once(p,
              '''        _readOnlyRemainingHostMultipleChoiceOptionIds =\n            _remainingHostMultipleChoiceOptionIds.AsReadOnly();''',
              '''        _readOnlyRemainingHostMultipleChoiceOptionIds =\n            _remainingHostMultipleChoiceOptionIds.AsReadOnly();\n        _readOnlyAllPlayerChoiceExcludedPlayerIds =\n            _allPlayerChoiceExcludedPlayerIds.AsReadOnly();''')
          replace_once(p,
              '''    public bool AreAllPlayerChoiceOptionsRevealed { get; private set; }\n\n    public bool AllPlayerChoiceRevealLocked { get; private set; }\n\n    public bool CanRevealAllPlayerChoiceOptions =>\n        RevealAnswerOptionsOnDemand &&\n        !AreAllPlayerChoiceOptionsRevealed &&\n        !AllPlayerChoiceRevealLocked &&\n        !IsSpecial &&\n        Status is RuntimeQuestionStatus.Selected or RuntimeQuestionStatus.Active &&\n        BuzzerStatus != QuestionBuzzerStatus.Claimed &&\n        AnsweringPlayerId is null &&\n        _answerAttempts.Count == 0;''',
              '''    public bool AreAllPlayerChoiceOptionsRevealed { get; private set; }\n\n    public IReadOnlyList<GamePlayerId> AllPlayerChoiceExcludedPlayerIds =>\n        _readOnlyAllPlayerChoiceExcludedPlayerIds;\n\n    public bool CanRevealAllPlayerChoiceOptions =>\n        RevealAnswerOptionsOnDemand &&\n        !AreAllPlayerChoiceOptionsRevealed &&\n        !IsSpecial &&\n        Status is RuntimeQuestionStatus.Selected or RuntimeQuestionStatus.Active;''')
          replace_once(p,
              '''        : PresentationType == QuestionPresentationType.FourClues\n            ? RevealedClueCount switch { 3 => Points / 2, 4 => Points / 4, _ => Points }\n            : IsHostMultipleChoice''',
              '''        : RevealAnswerOptionsOnDemand && AreAllPlayerChoiceOptionsRevealed\n            ? Math.Max(1, Points / 2)\n            : PresentationType == QuestionPresentationType.FourClues\n                ? RevealedClueCount switch { 3 => Points / 2, 4 => Points / 4, _ => Points }\n                : IsHostMultipleChoice''')
          replace_once(p,
              '''        IsHostMultipleChoice\n            ? _remainingHostMultipleChoiceOptionIds.ToArray()\n            : null,\n        AreAllPlayerChoiceOptionsRevealed,\n        AllPlayerChoiceRevealLocked);''',
              '''        IsHostMultipleChoice\n            ? _remainingHostMultipleChoiceOptionIds.ToArray()\n            : null,\n        AreAllPlayerChoiceOptionsRevealed,\n        _allPlayerChoiceExcludedPlayerIds.ToArray());''')
          replace_once(p,
              '''        AreAllPlayerChoiceOptionsRevealed =\n            !RevealAnswerOptionsOnDemand || state.AllPlayerChoiceOptionsRevealed;\n        AllPlayerChoiceRevealLocked = RevealAnswerOptionsOnDemand &&\n            (state.AllPlayerChoiceRevealLocked ||\n             state.BuzzerStatus == QuestionBuzzerStatus.Claimed ||\n             state.AnswerAttempts.Count > 0);\n        RevealedClueCount = PresentationType == QuestionPresentationType.FourClues''',
              '''        AreAllPlayerChoiceOptionsRevealed =\n            !RevealAnswerOptionsOnDemand || state.AllPlayerChoiceOptionsRevealed;\n        _allPlayerChoiceExcludedPlayerIds.Clear();\n        _allPlayerChoiceExcludedPlayerIds.AddRange(\n            (state.AllPlayerChoiceExcludedPlayerIds ?? [])\n                .Distinct());\n        RevealedClueCount = PresentationType == QuestionPresentationType.FourClues''')
          replace_once(p,
              '''        AreAllPlayerChoiceOptionsRevealed = true;\n        BuzzerStatus = QuestionBuzzerStatus.Closed;\n        AnsweringPlayerId = null;\n        Status = RuntimeQuestionStatus.Active;''',
              '''        _allPlayerChoiceExcludedPlayerIds.Clear();\n        _allPlayerChoiceExcludedPlayerIds.AddRange(\n            _answerAttempts\n                .Select(attempt => attempt.PlayerId)\n                .Distinct());\n        if (AnsweringPlayerId is { } answeringPlayerId &&\n            !_allPlayerChoiceExcludedPlayerIds.Contains(answeringPlayerId))\n        {\n            _allPlayerChoiceExcludedPlayerIds.Add(answeringPlayerId);\n        }\n\n        AreAllPlayerChoiceOptionsRevealed = true;\n        BuzzerStatus = QuestionBuzzerStatus.Closed;\n        AnsweringPlayerId = null;\n        Status = RuntimeQuestionStatus.Active;''')
          replace_once(p,
              '''        AnsweringPlayerId = playerId;\n        BuzzerStatus = QuestionBuzzerStatus.Claimed;\n        if (RevealAnswerOptionsOnDemand)\n        {\n            AllPlayerChoiceRevealLocked = true;\n        }''',
              '''        AnsweringPlayerId = playerId;\n        BuzzerStatus = QuestionBuzzerStatus.Claimed;''')
          replace_once(p,
              '''        _answerAttempts.Add(attempt);\n        if (RevealAnswerOptionsOnDemand)\n        {\n            AllPlayerChoiceRevealLocked = true;\n        }\n\n        if (isCorrect || IsSpecial)''',
              '''        _answerAttempts.Add(attempt);\n\n        if (isCorrect || IsSpecial)''')
          replace_once(p,
              '''        _answerAttempts.Add(attempt);\n        if (RevealAnswerOptionsOnDemand)\n        {\n            AllPlayerChoiceRevealLocked = true;\n        }\n        return attempt;''',
              '''        _answerAttempts.Add(attempt);\n        return attempt;''')

          p = 'src/BadWolfQuiz.Game/Runtime/GameSessionState.cs'
          replace_once(p,
              '''    IReadOnlyList<int>? RemainingHostMultipleChoiceOptionIds = null,\n    bool AllPlayerChoiceOptionsRevealed = false,\n    bool AllPlayerChoiceRevealLocked = false);''',
              '''    IReadOnlyList<int>? RemainingHostMultipleChoiceOptionIds = null,\n    bool AllPlayerChoiceOptionsRevealed = false,\n    IReadOnlyList<GamePlayerId>? AllPlayerChoiceExcludedPlayerIds = null);''')

          # All-player endpoint: exclude prior buzzer users from submissions,
          # score correct choices at the reduced value, and still render the
          # options disabled on their screens.
          p = 'src/BadWolfQuiz.Web/Pages/AllPlayerQuestion.cshtml.cs'
          replace_once(p,
              '''        var allSubmitted = AllCurrentPlayersSubmitted(game, question);\n        var phase = isWagering''',
              '''        var allSubmitted = AllCurrentPlayersSubmitted(game, question);\n        var isChoiceExcluded =\n            question.RevealAnswerOptionsOnDemand &&\n            question.AreAllPlayerChoiceOptionsRevealed &&\n            question.AllPlayerChoiceExcludedPlayerIds.Contains(player.Id);\n        var phase = isWagering''')
          replace_once(p,
              '''            hasSubmitted = attempt is not null,\n            isAccepting = phase == "answering" &&\n                (!isText || review!.Accepting),\n            isJudging = phase is "judging" or "awaitingMissing",''',
              '''            hasSubmitted = attempt is not null,\n            isChoiceExcluded,\n            isAccepting = phase == "answering" &&\n                !isChoiceExcluded &&\n                (!isText || review!.Accepting),\n            isJudging = phase is "judging" or "awaitingMissing",''')
          replace_once(p,
              '''        if (!question.IsSpecial)\n        {\n            return isCorrect ? question.Points : 0;\n        }''',
              '''        if (!question.IsSpecial)\n        {\n            return isCorrect ? question.CorrectAnswerValue : 0;\n        }''')
          replace_once(p,
              '''    private static IReadOnlyList<GamePlayer> CurrentParticipants(\n        GameSessionRegistration game,\n        RuntimeQuestion question)\n    {\n        if (!question.IsSpecial ||\n            question.Status == RuntimeQuestionStatus.AwaitingWager)\n        {\n            return game.Session.Players.ToArray();\n        }\n\n        var wagerPlayerIds = question.AllPlayerWagers\n            .Select(wager => wager.PlayerId)\n            .ToHashSet();\n        return game.Session.Players\n            .Where(player => wagerPlayerIds.Contains(player.Id))\n            .ToArray();\n    }''',
              '''    private static IReadOnlyList<GamePlayer> CurrentParticipants(\n        GameSessionRegistration game,\n        RuntimeQuestion question)\n    {\n        IEnumerable<GamePlayer> participants;\n        if (!question.IsSpecial ||\n            question.Status == RuntimeQuestionStatus.AwaitingWager)\n        {\n            participants = game.Session.Players;\n        }\n        else\n        {\n            var wagerPlayerIds = question.AllPlayerWagers\n                .Select(wager => wager.PlayerId)\n                .ToHashSet();\n            participants = game.Session.Players\n                .Where(player => wagerPlayerIds.Contains(player.Id));\n        }\n\n        if (question.RevealAnswerOptionsOnDemand &&\n            question.AreAllPlayerChoiceOptionsRevealed &&\n            question.AllPlayerChoiceExcludedPlayerIds.Count > 0)\n        {\n            var excludedPlayerIds =\n                question.AllPlayerChoiceExcludedPlayerIds.ToHashSet();\n            participants = participants.Where(player =>\n                !excludedPlayerIds.Contains(player.Id));\n        }\n\n        return participants.ToArray();\n    }''')

          # Player client: excluded buzzer users still see the revealed choices,
          # but every choice is disabled and the POST endpoint also rejects them.
          p = 'src/BadWolfQuiz.Web/wwwroot/js/all-player-question.js'
          replace_once(p,
              '            waitingForWagers: "Waiting for wagers"',
              '            waitingForWagers: "Waiting for wagers",\n            buzzerAlreadyUsed: "You already used the buzzer for this question."')
          replace_once(p,
              '            waitingForWagers: "Очікування ставок"',
              '            waitingForWagers: "Очікування ставок",\n            buzzerAlreadyUsed: "Ви вже натискали буззер у цьому питанні."')
          replace_once(p,
              '            waitingForWagers: "In attesa delle puntate"',
              '            waitingForWagers: "In attesa delle puntate",\n            buzzerAlreadyUsed: "Hai già usato il buzzer per questa domanda."')
          replace_once(p,
              '            waitingForWagers: "Україна"\n        }',
              '            waitingForWagers: "Україна",\n            buzzerAlreadyUsed: "Україна"\n        }')
          replace_once(p,
              '''            maximumWager: state.maximumWager,\n            options: (state.options ?? []).map(option => [''',
              '''            maximumWager: state.maximumWager,\n            isChoiceExcluded: state.isChoiceExcluded,\n            options: (state.options ?? []).map(option => [''')
          replace_once(p,
              '''            } else if (state.phase === "answering" &&\n                !state.hasSubmitted &&\n                state.isAccepting) {\n                buildAnswerControls(state);\n            }''',
              '''            } else if (state.phase === "answering" &&\n                !state.hasSubmitted &&\n                (state.isAccepting || state.isChoiceExcluded)) {\n                buildAnswerControls(state);\n                if (state.isChoiceExcluded) {\n                    setControlsDisabled(true);\n                }\n            }''')
          replace_once(p,
              '''            } else if (!state.isAccepting) {\n                setControlsDisabled(true);\n                controls.hidden = true;\n                status.textContent = text.closed;''',
              '''            } else if (state.isChoiceExcluded) {\n                setControlsDisabled(true);\n                controls.hidden = false;\n                status.textContent = text.buzzerAlreadyUsed;\n            } else if (!state.isAccepting) {\n                setControlsDisabled(true);\n                controls.hidden = true;\n                status.textContent = text.closed;''')

          # Localized help now reflects that reveal remains available after
          # buzzer usage, while prior buzzer users are excluded and value halves.
          resources = {
              'src/BadWolfQuiz.Web/Resources/Localization/SharedResource.resx': (
                  'The question starts with the buzzer like a regular question. Before the first buzz, the host can reveal the answer options to every player.',
                  'The question starts with the buzzer like a regular question. The host can reveal the answer options during the active question; the value is then reduced by 50%, and players who already used the buzzer cannot choose an option.'),
              'src/BadWolfQuiz.Web/Resources/Localization/SharedResource.uk.resx': (
                  'Питання починається з буззером як звичайне. До першого натискання на буззер хост може показати варіанти відповіді всім гравцям.',
                  'Питання починається з буззером як звичайне. Хост може показати варіанти під час активного питання; після цього вартість зменшується на 50%, а гравці, які вже натискали буззер, не можуть обирати відповідь.'),
              'src/BadWolfQuiz.Web/Resources/Localization/SharedResource.it.resx': (
                  'La domanda inizia con il buzzer come una domanda normale. Prima del primo buzzer, il conduttore può mostrare le opzioni di risposta a tutti i giocatori.',
                  'La domanda inizia con il buzzer come una domanda normale. Il conduttore può mostrare le opzioni durante la domanda attiva; il valore viene ridotto del 50% e chi ha già usato il buzzer non può scegliere una risposta.')
          }
          for path, (old, new) in resources.items():
              replace_once(path, old, new)

          # Runtime regression coverage for post-buzzer reveal, exclusions,
          # 50% reward and recovery.
          write('tests/BadWolfQuiz.Game.Tests/OnDemandAllPlayerMultipleChoiceTests.cs', '''using BadWolfQuiz.Game.Definitions;\nusing BadWolfQuiz.Game.Runtime;\n\nnamespace BadWolfQuiz.Game.Tests;\n\npublic sealed class OnDemandAllPlayerMultipleChoiceTests\n{\n    [Fact]\n    public void Snapshot_forces_on_demand_choice_out_of_every_wager_mode()\n    {\n        var question = CreateQuestion(isSpecial: true);\n\n        Assert.Equal(\n            QuestionPresentationType.AllPlayerMultipleChoiceOnDemand,\n            question.PresentationType);\n        Assert.False(question.IsSpecial);\n        Assert.True(question.ExcludeFromRandomWagerSelection);\n        Assert.False(question.IsEligibleForRandomWagerSelection);\n        Assert.False(question.IsEligibleForRandomAnonymousSharedWagerSelection);\n    }\n\n    [Fact]\n    public void Question_starts_with_regular_buzzer_and_reveal_halves_value()\n    {\n        var session = CreateSession();\n        session.AddPlayer("Rose");\n        session.Start();\n\n        var question = session.SelectQuestion(100);\n\n        Assert.True(question.RevealAnswerOptionsOnDemand);\n        Assert.False(question.AreAllPlayerChoiceOptionsRevealed);\n        Assert.False(question.IsAllPlayerQuestion);\n        Assert.True(question.CanRevealAllPlayerChoiceOptions);\n        Assert.Equal(200, question.CorrectAnswerValue);\n\n        if (question.BuzzerStatus == QuestionBuzzerStatus.Inactive)\n        {\n            session.ActivateQuestionBuzzer(100);\n        }\n\n        session.RevealAllPlayerChoiceOptions(100);\n\n        Assert.True(question.AreAllPlayerChoiceOptionsRevealed);\n        Assert.True(question.IsAllPlayerQuestion);\n        Assert.False(question.CanRevealAllPlayerChoiceOptions);\n        Assert.Empty(question.AllPlayerChoiceExcludedPlayerIds);\n        Assert.Equal(100, question.CorrectAnswerValue);\n        Assert.Equal(QuestionBuzzerStatus.Closed, question.BuzzerStatus);\n        Assert.Equal(GameTimerStatus.Running, session.Timer.Status);\n        Assert.Equal(GameTimerStatus.Stopped, session.AnswerTimer.Status);\n    }\n\n    [Fact]\n    public void Current_buzzer_claim_does_not_block_reveal_and_claimant_is_excluded()\n    {\n        var session = CreateSession();\n        var rose = session.AddPlayer("Rose");\n        session.AddPlayer("Jack");\n        session.Start();\n        var question = session.SelectQuestion(100);\n        if (question.BuzzerStatus == QuestionBuzzerStatus.Inactive)\n        {\n            session.ActivateQuestionBuzzer(100);\n        }\n\n        session.ClaimQuestionBuzzer(100, rose.Id);\n\n        Assert.True(question.CanRevealAllPlayerChoiceOptions);\n        session.RevealAllPlayerChoiceOptions(100);\n\n        Assert.Contains(rose.Id, question.AllPlayerChoiceExcludedPlayerIds);\n        Assert.Null(question.AnsweringPlayerId);\n        Assert.Equal(QuestionBuzzerStatus.Closed, question.BuzzerStatus);\n        Assert.Equal(100, question.CorrectAnswerValue);\n    }\n\n    [Fact]\n    public void Earlier_buzzer_attempts_are_excluded_when_options_are_revealed()\n    {\n        var session = CreateSession();\n        var rose = session.AddPlayer("Rose");\n        var jack = session.AddPlayer("Jack");\n        session.Start();\n        var question = session.SelectQuestion(100);\n        if (question.BuzzerStatus == QuestionBuzzerStatus.Inactive)\n        {\n            session.ActivateQuestionBuzzer(100);\n        }\n\n        session.ClaimQuestionBuzzer(100, rose.Id);\n        session.JudgeQuestionAnswer(100, rose.Id, false);\n\n        Assert.True(question.CanRevealAllPlayerChoiceOptions);\n        session.RevealAllPlayerChoiceOptions(100);\n\n        Assert.Contains(rose.Id, question.AllPlayerChoiceExcludedPlayerIds);\n        Assert.DoesNotContain(jack.Id, question.AllPlayerChoiceExcludedPlayerIds);\n    }\n\n    [Fact]\n    public void Revealed_phase_and_exclusions_survive_session_state_restore()\n    {\n        var session = CreateSession();\n        var rose = session.AddPlayer("Rose");\n        session.AddPlayer("Jack");\n        session.Start();\n        var question = session.SelectQuestion(100);\n        if (question.BuzzerStatus == QuestionBuzzerStatus.Inactive)\n        {\n            session.ActivateQuestionBuzzer(100);\n        }\n        session.ClaimQuestionBuzzer(100, rose.Id);\n        session.RevealAllPlayerChoiceOptions(100);\n\n        var restored = GameSession.Restore(\n            session.Quiz,\n            session.Settings,\n            session.CaptureState());\n        var restoredQuestion = Assert.Single(restored.Board.Questions);\n\n        Assert.True(restoredQuestion.RevealAnswerOptionsOnDemand);\n        Assert.True(restoredQuestion.AreAllPlayerChoiceOptionsRevealed);\n        Assert.True(restoredQuestion.IsAllPlayerQuestion);\n        Assert.Contains(rose.Id, restoredQuestion.AllPlayerChoiceExcludedPlayerIds);\n        Assert.Equal(100, restoredQuestion.CorrectAnswerValue);\n        Assert.Equal(QuestionBuzzerStatus.Closed, restoredQuestion.BuzzerStatus);\n    }\n\n    private static GameSession CreateSession()\n    {\n        var quiz = new QuizSnapshot(\n            1,\n            "On-demand choice",\n            [new QuizRoundSnapshot(1, "Round", 0, [CreateQuestion()])]);\n        return GameSession.Create(quiz);\n    }\n\n    private static QuizQuestionSnapshot CreateQuestion(bool isSpecial = false) => new(\n        100,\n        10,\n        0,\n        200,\n        isSpecial,\n        "Category",\n        excludeFromRandomWagerSelection: false,\n        questionBlocks: [TextBlock(1, "Question")],\n        answerBlocks: [TextBlock(10, "A"), TextBlock(11, "B")],\n        presentationType: QuestionPresentationType.AllPlayerMultipleChoiceOnDemand);\n\n    private static ContentBlockSnapshot TextBlock(int id, string text) => new(\n        id,\n        ContentBlockKind.Text,\n        text,\n        null,\n        null,\n        null,\n        null,\n        null,\n        null,\n        null,\n        id,\n        false);\n}\n''')

