name: Temporary CRLF regression verification

on:
  push:
    branches:
      - agent/575-redesign-answer-key

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj
      - name: Simulate Windows CRLF content files
        shell: python
        run: |
          from pathlib import Path

          files = [
              Path('src/BadWolfQuiz.Web/wwwroot/css/busy-indicators.css'),
              Path('src/BadWolfQuiz.Web/wwwroot/css/answer-key.css'),
              Path('src/BadWolfQuiz.Web/wwwroot/css/answer-key-image-frame.css'),
              Path('src/BadWolfQuiz.Web/wwwroot/js/final-question-host-responsiveness.js'),
              Path('src/BadWolfQuiz.Web/Pages/Player/Lobby.cshtml'),
              Path('src/BadWolfQuiz.Web/Pages/Admin/Games/AnswerKey.cshtml'),
          ]

          for path in files:
              text = path.read_text(encoding='utf-8').replace('\r\n', '\n').replace('\r', '\n')
              path.write_bytes(text.replace('\n', '\r\n').encode('utf-8'))
      - name: Run affected regression tests
        run: >-
          dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj
          --no-restore
          --filter "FullyQualifiedName~AnswerKeyCaptionScaleRegressionTests|FullyQualifiedName~AnswerKeyImageFrameRegressionTests|FullyQualifiedName~FinalQuestionHostStageRegressionTests|FullyQualifiedName~PlayerFinalQuestionStageRestyleRegressionTests"
