name: Validate PR 679 card artwork layout

on:
  push:
    branches:
      - validation/679-card-art-layout

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply card artwork layout fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence, found {count}: {old[:120]!r}')
              write(path, text.replace(old, new, 1))

          patch_css = 'src/BadWolfQuiz.Web/wwwroot/css/word-rings-action-cards-patch.css'
          replace_once(
              patch_css,
              '.word-rings-stage {\n    align-self: center;\n}\n',
              '.word-rings-stage {\n    align-self: center;\n}\n\n.word-rings-toolbar-progress[hidden] {\n    display: none !important;\n}\n')

          css = 'src/BadWolfQuiz.Web/wwwroot/css/word-rings-action-cards-v2.css'
          replace_once(
              css,
              '''    max-width: 170px;\n    min-height: 184px;\n    display: grid;\n    grid-template-rows: auto auto 1fr;\n    align-content: start;\n    gap: 6px;\n    padding: 11px;\n    overflow: visible;\n''',
              '''    max-width: 136px;\n    min-height: 0;\n    display: block;\n    padding: 0;\n    overflow: hidden;\n''')
          replace_once(
              css,
              '''.word-rings-action-card-image {\n    box-sizing: border-box;\n    width: 100%;\n    aspect-ratio: 16 / 9;\n    object-fit: contain;\n    border-radius: 10px;\n    background: color-mix(in srgb, var(--card-accent) 12%, var(--panel-2));\n}\n''',
              '''.word-rings-action-card-image {\n    box-sizing: border-box;\n    display: block;\n    width: 100%;\n    height: auto;\n    object-fit: cover;\n    border-radius: inherit;\n    background: transparent;\n}\n\n.word-rings-action-card-image[hidden],\n.word-rings-action-card-icon[hidden] {\n    display: none !important;\n}\n''')
          replace_once(
              css,
              '''.word-rings-action-card-description {\n    color: var(--muted);\n    font-size: .66rem;\n    line-height: 1.3;\n}\n''',
              '''.word-rings-action-card-description {\n    color: var(--muted);\n    font-size: .66rem;\n    line-height: 1.3;\n}\n\n.word-rings-action-card-name,\n.word-rings-action-card-description,\n.word-rings-action-card-passive {\n    display: none !important;\n}\n''')
          replace_once(
              css,
              '''.word-rings-action-dialog {\n    width: min(92vw, 540px);\n    max-height: 90dvh;\n}\n''',
              '''.word-rings-action-dialog {\n    width: min(92vw, 430px);\n    max-height: 92dvh;\n}\n''')
          replace_once(
              css,
              '''.word-rings-action-card.is-dialog-preview {\n    width: min(100%, 250px);\n    min-height: 300px;\n    max-width: 250px;\n    transform: none !important;\n    cursor: default;\n    pointer-events: none;\n}\n''',
              '''.word-rings-action-card.is-dialog-preview {\n    width: min(100%, 280px);\n    min-height: 0;\n    max-width: 280px;\n    transform: none !important;\n    cursor: default;\n    pointer-events: none;\n}\n''')
          replace_once(
              css,
              '''.word-rings-action-card.is-theft-preview {\n    width: min(100%, 200px);\n    min-height: 240px;\n    max-width: 200px;\n    transform: none !important;\n    cursor: default;\n    pointer-events: none;\n}\n''',
              '''.word-rings-action-card.is-theft-preview {\n    width: min(100%, 200px);\n    min-height: 0;\n    max-width: 200px;\n    transform: none !important;\n    cursor: default;\n    pointer-events: none;\n}\n''')
          replace_once(
              css,
              '''    .word-rings-action-card {\n        min-height: 160px;\n        padding: 9px;\n    }\n''',
              '''    .word-rings-action-card {\n        min-height: 0;\n        padding: 0;\n    }\n''')

          tag = 'src/BadWolfQuiz.Web/TagHelpers/WordRingsActionCardsAssetsTagHelper.cs'
          text = read(tag)
          for old, new in [
              ('word-rings-action-cards-v2.css?v=5', 'word-rings-action-cards-v2.css?v=6'),
              ('word-rings-action-cards-patch.css?v=2', 'word-rings-action-cards-patch.css?v=3')]:
              if text.count(old) != 1:
                  raise SystemExit(f'{tag}: expected one {old}')
              text = text.replace(old, new, 1)
          write(tag, text)

          tests = 'tests/BadWolfQuiz.Web.Tests/WordRingsActionCardsRegressionTests.cs'
          text = read(tests)
          text = text.replace(
              '        Assert.Contains("word-rings-action-cards-patch.css?v=2", tagHelper, StringComparison.Ordinal);\n',
              '        Assert.Contains("word-rings-action-cards-patch.css?v=3", tagHelper, StringComparison.Ordinal);\n'
              '        Assert.Contains("word-rings-action-cards-v2.css?v=6", tagHelper, StringComparison.Ordinal);\n')
          text = text.replace(
              '        Assert.Contains("align-self: end;", patchCss, StringComparison.Ordinal);\n',
              '        Assert.Contains("align-self: end;", patchCss, StringComparison.Ordinal);\n'
              '        Assert.Contains(".word-rings-toolbar-progress[hidden]", patchCss, StringComparison.Ordinal);\n')
          text = text.replace(
              '        Assert.Contains("overflow-x: hidden;", css, StringComparison.Ordinal);\n',
              '        Assert.Contains("overflow-x: hidden;", css, StringComparison.Ordinal);\n'
              '        Assert.Contains("max-width: 136px;", css, StringComparison.Ordinal);\n'
              '        Assert.Contains("object-fit: cover;", css, StringComparison.Ordinal);\n'
              '        Assert.Contains("word-rings-action-card-name,", css, StringComparison.Ordinal);\n'
              '        Assert.Contains("width: min(92vw, 430px);", css, StringComparison.Ordinal);\n'
              '        Assert.Contains("width: min(100%, 280px);", css, StringComparison.Ordinal);\n')
          if 'word-rings-action-cards-patch.css?v=2' in text:
              raise SystemExit('stale patch css version remains in tests')
          write(tests, text)
          PY

      - name: Restore web tests
        run: dotnet restore tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj

      - name: Run Word Rings action-card tests
        run: >-
          dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj
          --configuration Release
          --no-restore
          --filter "FullyQualifiedName~WordRingsActionCards"

      - name: Run full web test suite
        run: >-
          dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj
          --configuration Release
          --no-restore

      - name: Publish validated tree to temporary branch
        shell: bash
        run: |
          rm .github/workflows/validation-679-card-art-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Validate action card artwork layout"
          git push origin HEAD:validation/679-card-art-layout
          echo "VALIDATED_COMMIT=$(git rev-parse HEAD)"

      - name: Remove temporary branch after handoff
        if: success()
        shell: bash
        run: |
          sleep 300
          git push origin --delete validation/679-card-art-layout
