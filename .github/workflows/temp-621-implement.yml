name: Temporary issue 621 implementation

on:
  push:
    branches:
      - feature/621-player-achievement-history
    paths:
      - .github/workflows/temp-621-implement.yml

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Fix selected-player route binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          page = Path("src/BadWolfQuiz.Web/Pages/Admin/Games/PlayerAchievements.cshtml")
          text = page.read_text(encoding="utf-8-sig")
          old = 'asp-route-selected-player-id'
          new = 'asp-route-selectedPlayerId'
          if old not in text:
              raise SystemExit("Expected selected-player route attributes were not found.")
          page.write_text(text.replace(old, new), encoding="utf-8")

          test = Path("tests/BadWolfQuiz.Web.Tests/PlayerAchievementHistoryUiRegressionTests.cs")
          text = test.read_text(encoding="utf-8-sig")
          old_assert = 'Assert.Contains("asp-route-selected-player-id", page);'
          new_assert = '''Assert.Contains("asp-route-selectedPlayerId", page);\n        Assert.DoesNotContain("asp-route-selected-player-id", page);'''
          if old_assert not in text:
              raise SystemExit("Expected route regression assertion was not found.")
          test.write_text(text.replace(old_assert, new_assert, 1), encoding="utf-8")
          PY

          git diff --check

      - name: Build web
        run: dotnet build src/BadWolfQuiz.Web/BadWolfQuiz.Web.csproj --configuration Release

      - name: Test game
        run: dotnet test tests/BadWolfQuiz.Game.Tests/BadWolfQuiz.Game.Tests.csproj --configuration Release

      - name: Test web
        run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj --configuration Release

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/BadWolfQuiz.Web/Pages/Admin/Games/PlayerAchievements.cshtml tests/BadWolfQuiz.Web.Tests/PlayerAchievementHistoryUiRegressionTests.cs
          git commit -m "Fix achievement history player selection routing"
          git push origin HEAD:feature/621-player-achievement-history
