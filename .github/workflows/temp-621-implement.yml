name: Temporary issue 621 implementation

on:
  push:
    branches:
      - feature/621-player-achievement-history
    paths:
      - .github/workflows/temp-621-implement.yml

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply implementation
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8-sig")
              if old not in text:
                  raise SystemExit(f"Anchor not found in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/BadWolfQuiz.Web/Pages/Admin/Games/Lobby.cshtml",
              "@model BadWolfQuiz.Web.Pages.Admin.Games.LobbyModel\n@{",
              "@model BadWolfQuiz.Web.Pages.Admin.Games.LobbyModel\n@inject Microsoft.Extensions.Localization.IStringLocalizer<BadWolfQuiz.Web.Localization.PlayerAchievementHistoryResource> AchievementHistoryLocalizer\n@{")

          replace_once(
              "src/BadWolfQuiz.Web/Pages/Admin/Games/Lobby.cshtml",
              "                <div class=\"action-menu-popover\">\n                    @if (Model.CurrentQuestion is null)",
              "                <div class=\"action-menu-popover\">\n                    <a class=\"action-menu-item\"\n                       asp-page=\"/Admin/Games/PlayerAchievements\"\n                       asp-route-id=\"@Model.Game.Session.Id.Value\">\n                        @AchievementHistoryLocalizer[\"History_Open\"]\n                    </a>\n\n                    @if (Model.CurrentQuestion is null)")

          replace_once(
              "src/BadWolfQuiz.Web/Pages/Shared/_Layout.cshtml",
              "@inject IStringLocalizer<ProductVersionResource> ProductVersionLocalizer\n",
              "@inject IStringLocalizer<ProductVersionResource> ProductVersionLocalizer\n@inject IStringLocalizer<PlayerAchievementHistoryResource> AchievementHistoryLocalizer\n")

          replace_once(
              "src/BadWolfQuiz.Web/Pages/Shared/_Layout.cshtml",
              "                    <div class=\"action-menu-popover\">\n                        <a class=\"action-menu-item\"\n                           asp-page=\"/Admin/Games/AnswerHistory\"",
              "                    <div class=\"action-menu-popover\">\n                        <a class=\"action-menu-item\"\n                           asp-page=\"/Admin/Games/PlayerAchievements\"\n                           asp-route-id=\"@finalQuestionGame.Session.Id.Value\">\n                            @AchievementHistoryLocalizer[\"History_Open\"]\n                        </a>\n\n                        <a class=\"action-menu-item\"\n                           asp-page=\"/Admin/Games/AnswerHistory\"")

          service_path = "src/BadWolfQuiz.Web/Services/PlayerAchievementService.cs"
          service_anchor = "    public Task<bool> UnlockAccountAsync(\n"
          service_method = '''    /// <summary>\n    /// Reads already-persisted unlocks for one authoritative player identity.\n    /// This method never evaluates, unlocks, adopts, or otherwise changes achievement state.\n    /// </summary>\n    public async Task<IReadOnlyList<PlayerAchievement>> LoadPersistedUnlocksAsync(\n        string? accountId,\n        string? hostId,\n        string playerName,\n        int? sourceGameSessionId = null,\n        CancellationToken cancellationToken = default)\n    {\n        var identity = PlayerAchievementIdentity.Create(accountId, hostId, playerName);\n        if (!identity.IsValid)\n        {\n            return [];\n        }\n\n        var query = QueryForIdentity(identity)\n            .AsNoTracking()\n            .Where(item => !item.AchievementCode.StartsWith("__"));\n        if (sourceGameSessionId.HasValue)\n        {\n            query = query.Where(item => item.SourceGameSessionId == sourceGameSessionId.Value);\n        }\n\n        return await query\n            .OrderByDescending(item => item.UnlockedAtUtc)\n            .ThenByDescending(item => item.Id)\n            .ToListAsync(cancellationToken);\n    }\n\n'''
          replace_once(service_path, service_anchor, service_method + service_anchor)

          replace_once(
              "docs/features/player-achievements.md",
              "The host lobby exposes a trophy action on each player row. It opens a host-owned achievement dialog for that specific player; the endpoint verifies ownership of the active game before returning achievement data.\n",
              "The host lobby exposes a trophy action on each player row. It opens a host-owned achievement dialog for that specific player; the endpoint verifies ownership of the active game before returning achievement data.\n\nThe active-game **Tools** menu also exposes **Player achievements**, which opens a dedicated host-owned, read-only history page. Its **Unlocked in this game** view shows persisted unlocks whose `SourceGameSessionId` belongs to the current stored game and associates each row with the matching current player identity. Its **Players' histories** view lets the host select any current player and inspect that player's complete persisted unlock history, newest first. Signed-in players use their account identity; anonymous players use the existing host + normalized-name fallback identity, so the page follows the same confirmed adoption rules as gameplay without triggering adoption itself.\n\nThe history page never calls achievement evaluation or unlock logic. It reads `PlayerAchievements` with no tracking, excludes internal progress-helper rows, refreshes from persistence on every request, and remains available while the game is running. Player selection limits the full-history view to one current player at a time and the result list uses a bounded scrolling region so large histories do not make the host UI unusable. Unknown non-internal achievement codes remain displayable with fallback presentation so future host-defined achievements can plug their own metadata/artwork into the same history surface.\n")
          PY

          mkdir -p src/BadWolfQuiz.Web/Localization
          mkdir -p src/BadWolfQuiz.Web/Resources/Localization
          mkdir -p src/BadWolfQuiz.Web/wwwroot/css
          mkdir -p src/BadWolfQuiz.Web/wwwroot/js
