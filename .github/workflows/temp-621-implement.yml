          using System.Globalization;
          using BadWolfQuiz.Game.Runtime;
          using BadWolfQuiz.Web.Data;
          using BadWolfQuiz.Web.Localization;
          using BadWolfQuiz.Web.Models;
          using BadWolfQuiz.Web.Services;
          using Microsoft.AspNetCore.Mvc;
          using Microsoft.AspNetCore.Mvc.RazorPages;
          using Microsoft.EntityFrameworkCore;
          using Microsoft.Extensions.Localization;
          using Microsoft.Extensions.Options;

          namespace BadWolfQuiz.Web.Pages.Admin.Games;

          public sealed class PlayerAchievementsModel(
              QuizDbContext db,
              GameSessionRegistry sessionRegistry,
              CurrentHost currentHost,
              IStringLocalizer<AchievementResource> localizer,
              IStringLocalizer<PlayerAchievementHistoryResource> historyLocalizer,
              IOptions<FooterOptions> footerOptions) : PageModel
          {
              public const string GameMode = "game";
              public const string PlayersMode = "players";

              public GameSessionRegistration Game { get; private set; } = null!;
              public string Mode { get; private set; } = GameMode;
              public IReadOnlyList<PlayerAchievementHistoryPlayer> Players { get; private set; } = [];
              public Guid? SelectedPlayerId { get; private set; }
              public IReadOnlyList<PlayerAchievementHistoryEntry> Entries { get; private set; } = [];

              public async Task<IActionResult> OnGetAsync(
                  Guid id,
                  Guid? playerId,
                  string? mode,
                  Guid? selectedPlayerId,
                  CancellationToken cancellationToken)
              {
                  var game = sessionRegistry.FindOwned(
                      new GameSessionId(id),
                      currentHost.RequiredId);
                  if (game is null)
                  {
                      return NotFound();
                  }

                  if (playerId.HasValue)
                  {
                      return await BuildPlayerDialogJsonAsync(
                          game,
                          playerId.Value,
                          cancellationToken);
                  }

                  return await LoadHistoryPageAsync(
                      game,
                      mode,
                      selectedPlayerId,
                      cancellationToken);
              }

              public static string ToUtcIso(DateTime value) =>
                  EnsureUtc(value).ToString("O", CultureInfo.InvariantCulture);

              public static string FormatUtcFallback(DateTime value) =>
                  $"{EnsureUtc(value).ToString("g", CultureInfo.CurrentCulture)} UTC";

              private async Task<IActionResult> BuildPlayerDialogJsonAsync(
                  GameSessionRegistration game,
                  Guid playerId,
                  CancellationToken cancellationToken)
              {
                  var player = sessionRegistry
                      .GetPlayers(game)
                      .FirstOrDefault(item => item.Id == new GamePlayerId(playerId));
                  if (player is null)
                  {
                      return NotFound();
                  }

                  var accountId = PlayerAchievementRuntimeState.GetPlayerAccountId(game, player.Id);
                  var isContributor = player.HasTemporaryContributorPrivileges ||
                      ContributorRecognition.IsContributor(
                          footerOptions.Value,
                          player.OriginalName);

                  if (!isContributor && !string.IsNullOrWhiteSpace(accountId))
                  {
                      var accountDisplayName = await db.Hosts
                          .IgnoreQueryFilters()
                          .AsNoTracking()
                          .Where(host => host.Id == accountId)
                          .Select(host => host.DisplayName)
                          .SingleOrDefaultAsync(cancellationToken);
                      isContributor = ContributorRecognition.IsContributor(
                          footerOptions.Value,
                          accountDisplayName);
                  }

                  var achievements = await new PlayerAchievementService(db).LoadForPlayerAsync(
                      game.HostId,
                      player.Name,
                      game.PublicCode,
                      accountId,
                      isContributor,
                      cancellationToken);

                  var unlockedCount = achievements.Count(item => item.IsUnlocked);
                  return new JsonResult(new
                  {
                      playerName = player.Name,
                      title = localizer["Achievements_Title"].Value,
                      subtitle = localizer["Achievements_Subtitle"].Value,
                      closeLabel = localizer["Achievements_Close"].Value,
                      unlockedCountText = localizer[
                          "Achievements_UnlockedCount",
                          unlockedCount,
                          achievements.Count].Value,
                      secretTitle = localizer["Achievements_SecretTitle"].Value,
                      secretDescription = localizer["Achievements_SecretDescription"].Value,
                      achievements = achievements.Select(item => new
                      {
                          item.Code,
                          item.Icon,
                          item.IsUnlocked,
                          item.IsSecret,
                          item.IsNewInCurrentGame,
                          item.Progress,
                          item.Target,
                          name = localizer[$"{item.Code}_Name"].Value,
                          description = localizer[$"{item.Code}_Description"].Value
                      })
                  });
              }

              private async Task<IActionResult> LoadHistoryPageAsync(
                  GameSessionRegistration game,
                  string? mode,
                  Guid? selectedPlayerId,
                  CancellationToken cancellationToken)
              {
                  Game = game;
                  Mode = string.Equals(mode, PlayersMode, StringComparison.OrdinalIgnoreCase)
                      ? PlayersMode
                      : GameMode;

                  Players = sessionRegistry
                      .GetPlayers(game)
                      .OrderBy(player => player.Name, StringComparer.CurrentCultureIgnoreCase)
                      .Select(player => new PlayerAchievementHistoryPlayer(
                          player.Id.Value,
                          player.Name,
                          PlayerAchievementRuntimeState.GetPlayerAccountId(game, player.Id)))
                      .ToArray();

                  var selectedPlayer = Players.FirstOrDefault(player =>
                          selectedPlayerId.HasValue && player.Id == selectedPlayerId.Value)
                      ?? Players.FirstOrDefault();
                  SelectedPlayerId = selectedPlayer?.Id;

                  var achievementService = new PlayerAchievementService(db);
                  if (Mode == PlayersMode)
                  {
                      if (selectedPlayer is null)
                      {
                          Entries = [];
                          return Page();
                      }

                      var persisted = await achievementService.LoadPersistedUnlocksAsync(
                          selectedPlayer.AccountId,
                          game.HostId,
                          selectedPlayer.Name,
                          cancellationToken: cancellationToken);
                      Entries = persisted
                          .Select(item => CreateHistoryEntry(selectedPlayer, item))
                          .ToArray();
                      return Page();
                  }

                  var storedGameSessionId = await db.GameSessions
                      .IgnoreQueryFilters()
                      .AsNoTracking()
                      .Where(session =>
                          session.PublicCode == game.PublicCode &&
                          session.HostId == currentHost.RequiredId)
                      .Select(session => (int?)session.Id)
                      .SingleOrDefaultAsync(cancellationToken);
                  if (!storedGameSessionId.HasValue)
                  {
                      Entries = [];
                      return Page();
                  }

                  var entries = new List<PlayerAchievementHistoryEntry>();
                  foreach (var player in Players)
                  {
                      var persisted = await achievementService.LoadPersistedUnlocksAsync(
                          player.AccountId,
                          game.HostId,
                          player.Name,
                          storedGameSessionId.Value,
                          cancellationToken);
                      entries.AddRange(persisted.Select(item => CreateHistoryEntry(player, item)));
                  }

                  Entries = entries
                      .OrderByDescending(item => item.UnlockedAtUtc)
                      .ThenByDescending(item => item.RecordId)
                      .ThenBy(item => item.PlayerName, StringComparer.CurrentCultureIgnoreCase)
                      .ToArray();
                  return Page();
              }

              private PlayerAchievementHistoryEntry CreateHistoryEntry(
                  PlayerAchievementHistoryPlayer player,
                  PlayerAchievement achievement)
              {
                  var definition = PlayerAchievementService.Catalog.FirstOrDefault(item =>
                      string.Equals(item.Code, achievement.AchievementCode, StringComparison.Ordinal));
                  var name = localizer[$"{achievement.AchievementCode}_Name"];
                  var description = localizer[$"{achievement.AchievementCode}_Description"];

                  return new PlayerAchievementHistoryEntry(
                      achievement.Id,
                      player.Id,
                      player.Name,
                      achievement.AchievementCode,
                      name.ResourceNotFound ? achievement.AchievementCode : name.Value,
                      description.ResourceNotFound
                          ? historyLocalizer["History_UnknownDescription"].Value
                          : description.Value,
                      definition is null
                          ? null
                          : $"/images/achievements/{Uri.EscapeDataString(achievement.AchievementCode)}.png",
                      achievement.UnlockedAtUtc,
                      achievement.SourceGameSessionId);
              }

              private static DateTime EnsureUtc(DateTime value) => value.Kind switch
              {
                  DateTimeKind.Utc => value,
                  DateTimeKind.Local => value.ToUniversalTime(),
                  _ => DateTime.SpecifyKind(value, DateTimeKind.Utc)
              };
          }

          public sealed record PlayerAchievementHistoryPlayer(
              Guid Id,
              string Name,
              string? AccountId);

          public sealed record PlayerAchievementHistoryEntry(
              int RecordId,
              Guid PlayerId,
              string PlayerName,
              string AchievementCode,
              string Name,
              string Description,
              string? ArtworkUrl,
              DateTime UnlockedAtUtc,
              int? SourceGameSessionId);
          EOF

          cat > src/BadWolfQuiz.Web/Pages/Admin/Games/PlayerAchievements.cshtml <<'EOF'
          @page
          @model BadWolfQuiz.Web.Pages.Admin.Games.PlayerAchievementsModel
          @inject Microsoft.Extensions.Localization.IStringLocalizer<BadWolfQuiz.Web.Localization.PlayerAchievementHistoryResource> HistoryLocalizer
          @{
              ViewData["Title"] = HistoryLocalizer["History_Title"];
              var isGameMode = Model.Mode == BadWolfQuiz.Web.Pages.Admin.Games.PlayerAchievementsModel.GameMode;
          }

          @section Styles {
              <link rel="stylesheet" href="~/css/player-achievement-history.css" asp-append-version="true" />
          }

          <section class="player-achievement-history-page" aria-labelledby="player-achievement-history-title">
              <header class="player-achievement-history-hero">
                  <div class="player-achievement-history-hero-copy">
                      <p class="player-achievement-history-kicker">@HistoryLocalizer["History_Eyebrow"]</p>
                      <h1 id="player-achievement-history-title">@HistoryLocalizer["History_Title"]</h1>
                      <p class="player-achievement-history-description">@HistoryLocalizer["History_Description"]</p>

                      <a class="button button-secondary player-achievement-history-back"
                         asp-page="/Admin/Games/Lobby"
                         asp-route-id="@Model.Game.Session.Id.Value">
                          <span aria-hidden="true">←</span>
                          <span>@HistoryLocalizer["History_BackToGame"]</span>
                      </a>
                  </div>

                  <aside class="player-achievement-history-session" aria-label="@Model.Game.Session.Quiz.Title">
                      <span>@HistoryLocalizer["History_CurrentGame"]</span>
                      <strong>@Model.Game.Session.Quiz.Title</strong>
                      <small>@HistoryLocalizer["History_EntryCount", Model.Entries.Count]</small>
                  </aside>
              </header>

              <main class="player-achievement-history-content">
                  <nav class="player-achievement-history-filters"
                       aria-label="@HistoryLocalizer["History_FilterLabel"]">
                      <a class="button button-secondary player-achievement-history-filter @(isGameMode ? "is-active" : null)"
                         aria-current="@(isGameMode ? "page" : null)"
                         asp-page="/Admin/Games/PlayerAchievements"
                         asp-route-id="@Model.Game.Session.Id.Value"
                         asp-route-mode="@BadWolfQuiz.Web.Pages.Admin.Games.PlayerAchievementsModel.GameMode">
                          @HistoryLocalizer["History_FilterGame"]
                      </a>
                      <a class="button button-secondary player-achievement-history-filter @(!isGameMode ? "is-active" : null)"
                         aria-current="@(!isGameMode ? "page" : null)"
                         asp-page="/Admin/Games/PlayerAchievements"
                         asp-route-id="@Model.Game.Session.Id.Value"
                         asp-route-mode="@BadWolfQuiz.Web.Pages.Admin.Games.PlayerAchievementsModel.PlayersMode"
                         asp-route-selected-player-id="@Model.SelectedPlayerId">
                          @HistoryLocalizer["History_FilterPlayers"]
                      </a>
                  </nav>

                  <p class="player-achievement-history-readonly">@HistoryLocalizer["History_ReadOnly"]</p>

                  @if (Model.Players.Count == 0)
                  {
                      <div class="player-achievement-history-empty" role="status">
                          <span aria-hidden="true">🏆</span>
                          <p>@HistoryLocalizer["History_NoPlayers"]</p>
                      </div>
                  }
                  else
                  {
                      @if (!isGameMode)
                      {
                          <div class="player-achievement-history-player-picker"
                               aria-label="@HistoryLocalizer["History_PlayerSelector"]">
                              @foreach (var player in Model.Players)
                              {
                                  var isSelected = Model.SelectedPlayerId == player.Id;
                                  <a class="player-achievement-history-player @(isSelected ? "is-active" : null)"
                                     aria-current="@(isSelected ? "true" : null)"
                                     asp-page="/Admin/Games/PlayerAchievements"
                                     asp-route-id="@Model.Game.Session.Id.Value"
                                     asp-route-mode="@BadWolfQuiz.Web.Pages.Admin.Games.PlayerAchievementsModel.PlayersMode"
                                     asp-route-selected-player-id="@player.Id">
                                      @player.Name
                                  </a>
                              }
                          </div>
                      }

                      @if (Model.Entries.Count == 0)
                      {
                          <div class="player-achievement-history-empty" role="status">
                              <span aria-hidden="true">🏆</span>
                              <p>@HistoryLocalizer[isGameMode ? "History_NoGameUnlocks" : "History_NoPlayerUnlocks"]</p>
                          </div>
                      }
                      else
                      {
                          <div class="player-achievement-history-list">
                              @foreach (var entry in Model.Entries)
                              {
                                  <article class="player-achievement-history-entry"
                                           data-achievement-code="@entry.AchievementCode"
                                           data-player-id="@entry.PlayerId">
                                      <div class="player-achievement-history-artwork" aria-hidden="true">
                                          @if (!string.IsNullOrWhiteSpace(entry.ArtworkUrl))
                                          {
                                              <img src="@entry.ArtworkUrl"
                                                   alt=""
                                                   loading="lazy"
                                                   decoding="async" />
                                          }
                                          else
                                          {
                                              <span>🏆</span>
                                          }
                                      </div>

                                      <div class="player-achievement-history-copy">
                                          <span class="player-achievement-history-player-name">@entry.PlayerName</span>
                                          <strong>@entry.Name</strong>
                                          <p>@entry.Description</p>
                                      </div>

                                      <div class="player-achievement-history-time">
                                          <span>@HistoryLocalizer["History_UnlockedAt"]</span>
                                          <time datetime="@BadWolfQuiz.Web.Pages.Admin.Games.PlayerAchievementsModel.ToUtcIso(entry.UnlockedAtUtc)"
                                                data-achievement-history-time>
                                              @BadWolfQuiz.Web.Pages.Admin.Games.PlayerAchievementsModel.FormatUtcFallback(entry.UnlockedAtUtc)
                                          </time>
                                      </div>
                                  </article>
                              }
                          </div>
                      }
                  }
              </main>
          </section>

          @section Scripts {
              <script defer src="~/js/player-achievement-history.js" asp-append-version="true"></script>
          }
          EOF

