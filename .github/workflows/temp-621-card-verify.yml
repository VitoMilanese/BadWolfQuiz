name: Temporary issue 621 card verification

on:
  push:
    branches:
      - feature/621-player-achievement-history
    paths:
      - .github/workflows/temp-621-card-verify.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Diff check
        run: git diff --check origin/main...HEAD
      - name: Build web
        run: dotnet build src/BadWolfQuiz.Web/BadWolfQuiz.Web.csproj --configuration Release
      - name: Test web
        run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj --configuration Release
