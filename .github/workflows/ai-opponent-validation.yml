name: AI Opponent Validation

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore BadWolfQuiz.sln
      - name: Test
        run: dotnet test BadWolfQuiz.sln --no-restore --configuration Release
