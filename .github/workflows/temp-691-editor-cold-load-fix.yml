name: Temporary issue 691 editor cold-load fix

on:
  push:
    branches:
      - feature/691-on-demand-answer-options

permissions:
  contents: write

jobs:
  implement-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Apply deterministic first-render editor fix
        run: python3 .github/temp-691-editor-cold-load-fix.py
      - name: Run focused editor regressions
        run: >-
          dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj
          --configuration Release
          --filter "FullyQualifiedName~OnDemandAllPlayerChoiceRegressionTests|FullyQualifiedName~MultipleChoiceEditorStabilityRegressionTests|FullyQualifiedName~AnswerRewardButtonsRegressionTests|FullyQualifiedName~AnonymousSharedWagerEditorUiRegressionTests"
      - name: Run full web test suite
        run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj --configuration Release
      - name: Commit tested fix and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/temp-691-editor-cold-load-fix.yml
          rm .github/temp-691-editor-cold-load-fix.py
          git config user.name "Vitalii Hanych"
          git config user.email "64318287+VitoMilanese@users.noreply.github.com"
          git add -A
          git commit -m "Fix on-demand editor cold-load state"
          git push origin HEAD:feature/691-on-demand-answer-options
