name: Temporary achievement card validation

on:
  push:
    branches:
      - achievements-png
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run full test suite
        run: dotnet test BadWolfQuiz.sln --configuration Release
