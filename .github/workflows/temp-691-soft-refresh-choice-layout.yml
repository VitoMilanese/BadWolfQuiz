name: Temporary issue 691 soft refresh choice layout

on:
  push:
    branches:
      - feature/691-on-demand-answer-options

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply soft-refresh fix
        run: python3 .github/temp-691-soft-refresh-choice-layout.py

      - name: Run focused web tests
        run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj --configuration Release --filter "FullyQualifiedName~OnDemandAllPlayerChoiceRegressionTests|FullyQualifiedName~HostGameplayNavigationMarkupTests|FullyQualifiedName~MandatoryAllPlayerQuestionRegressionTests"

      - name: Run full web test suite
        run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj --configuration Release

      - name: Commit tested fix and remove temporary files
        if: success()
        shell: bash
        run: |
          rm .github/workflows/temp-691-soft-refresh-choice-layout.yml
          rm .github/temp-691-soft-refresh-choice-layout.py
          git config user.name "Vitalii Hanych"
          git config user.email "64318287+VitoMilanese@users.noreply.github.com"
          git add -A
          git commit -m "Fix host refresh after on-demand choice reveal"
          git push origin HEAD:feature/691-on-demand-answer-options
