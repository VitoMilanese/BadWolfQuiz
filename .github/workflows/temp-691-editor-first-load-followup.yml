name: Temporary issue 691 editor first-load follow-up

on:
  push:
    branches:
      - feature/691-on-demand-answer-options
    paths:
      - .github/temp-691-editor-first-load-followup.py
      - .github/workflows/temp-691-editor-first-load-followup.yml

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Apply editor first-load fixes
        run: python3 .github/temp-691-editor-first-load-followup.py
      - name: Run focused web tests
        run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj --configuration Release --filter "FullyQualifiedName~OnDemandAllPlayerChoiceRegressionTests|FullyQualifiedName~MultipleChoiceEditorStabilityRegressionTests|FullyQualifiedName~AnswerRewardButtonsRegressionTests|FullyQualifiedName~AnonymousSharedWagerEditorUiRegressionTests"
      - name: Run full web test suite
        run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj --configuration Release
      - name: Commit tested follow-up and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/temp-691-editor-first-load-followup.yml
          rm .github/temp-691-editor-first-load-followup.py
          git config user.name "Vitalii Hanych"
          git config user.email "64318287+VitoMilanese@users.noreply.github.com"
          git add -A
          git commit -m "Fix first-load on-demand editor state"
          git push origin HEAD:feature/691-on-demand-answer-options
