name: temp-344-fix-regression-tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Patch stale final lifecycle assertion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          registry_path = Path('tests/BadWolfQuiz.Web.Tests/GameSessionRegistryTests.cs')
          registry = registry_path.read_text()
          old_status = '''        Assert.Equal(
            BadWolfQuiz.Game.Runtime.GameSessionStatus.Completed,
            game.Session.Status);
        Assert.Equal(350, joined.Player.Score);
'''
          new_status = '''        Assert.Equal(
            BadWolfQuiz.Game.Runtime.GameSessionStatus.FinalJudging,
            game.Session.Status);
        Assert.Equal(350, joined.Player.Score);

        registry.CompleteFinalQuestion("ABC123");

        Assert.Equal(
            BadWolfQuiz.Game.Runtime.GameSessionStatus.Completed,
            game.Session.Status);
'''
          if old_status not in registry:
              raise SystemExit('Final status assertion anchor not found')
          registry_path.write_text(registry.replace(old_status, new_status, 1))
          PY

      - name: Run affected regression tests
        run: >-
          dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj
          --filter "FullyQualifiedName~ContentBlockAutoplayRegressionTests.Host_native_media_autoplays_and_uses_normal_media_lifecycle|FullyQualifiedName~GameplayRightOverlaySafeGapRegressionTests.Final_answering_collapses_by_width_without_crossing_its_right_anchor|FullyQualifiedName~GameplayRightOverlaySafeGapRegressionTests.Final_answering_does_not_reserve_its_own_scrollbar_when_the_list_fits|FullyQualifiedName~GameSessionRegistryTests.Final_question_routes_private_player_actions_by_approved_connection"
          --configuration Release
          --verbosity minimal

      - name: Commit patched test for extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/BadWolfQuiz.Web.Tests/GameSessionRegistryTests.cs
          git commit -m "TEMP align final lifecycle regression test"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
