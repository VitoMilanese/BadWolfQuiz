name: Temporary framed player card resize validation

on:
  push:
    branches:
      - fix/framed-player-card-resize
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check framed media script syntax
        run: node --check src/BadWolfQuiz.Web/wwwroot/js/contributor-frame-media-parity.js

      - name: Run Web test suite
        run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj --configuration Release
