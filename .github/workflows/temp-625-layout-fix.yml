name: Temporary 625 pending layout fix

on:
  push:
    branches:
      - feature/625-manual-achievement-history-confirmation

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.event.head_commit.message == 'Add temporary pending layout fix workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Fix pending layout and header alignment
        shell: python
        run: |
          from pathlib import Path

          css_path = Path('src/BadWolfQuiz.Web/wwwroot/css/player-achievement-history.css')
          css = css_path.read_text()
          css = css.replace(
              '.player-achievement-history-body.is-players-mode {\n    display: grid;',
              '.player-achievement-history-body.is-players-mode,\n.player-achievement-history-body.is-pending-mode {\n    display: grid;')
          css = css.replace(
              '    .player-achievement-history-body.is-players-mode {\n        grid-template-columns: 1fr;\n    }',
              '    .player-achievement-history-body.is-players-mode,\n    .player-achievement-history-body.is-pending-mode {\n        grid-template-columns: 1fr;\n    }')
          css_path.write_text(css)

          page_path = Path('src/BadWolfQuiz.Web/Pages/Admin/Games/PlayerAchievements.cshtml')
          page = page_path.read_text()
          old = '''                            <header class="player-achievement-history-pending-header">
                                <b>@HistoryLocalizer["History_PendingPreviousGames", pending.PendingGameCount]</b>
                            </header>

                            <p class="player-achievement-history-pending-description">
                                @HistoryLocalizer["History_PendingPlayerDescription", pending.PlayerName]
                            </p>'''
          new = '''                            <header class="player-achievement-history-pending-header">
                                <p class="player-achievement-history-pending-description">
                                    @HistoryLocalizer["History_PendingPlayerDescription", pending.PlayerName]
                                </p>
                                <b>@HistoryLocalizer["History_PendingPreviousGames", pending.PendingGameCount]</b>
                            </header>'''
          if old not in page:
              raise SystemExit('Pending header block not found')
          page_path.write_text(page.replace(old, new))

          confirm_css_path = Path('src/BadWolfQuiz.Web/wwwroot/css/player-achievement-history-confirmation.css')
          confirm_css = confirm_css_path.read_text()
          confirm_css = confirm_css.replace(
              '''.player-achievement-history-pending-header {
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
    gap: 18px;
}''',
              '''.player-achievement-history-pending-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
}

.player-achievement-history-pending-header .player-achievement-history-pending-description {
    flex: 1 1 auto;
}''')
          confirm_css_path.write_text(confirm_css)

          test_path = Path('tests/BadWolfQuiz.Web.Tests/PlayerAchievementHistoryUiRegressionTests.cs')
          test = test_path.read_text()
          test = test.replace(
              '        Assert.Contains("grid-template-columns: minmax(230px, 290px) minmax(0, 1fr)", css);',
              '        Assert.Contains(".player-achievement-history-body.is-players-mode,\\n.player-achievement-history-body.is-pending-mode", css);\n        Assert.Contains("grid-template-columns: minmax(230px, 290px) minmax(0, 1fr)", css);')
          test = test.replace(
              '        Assert.Contains("justify-content: flex-end", confirmationCss);',
              '        Assert.Contains("align-items: center", confirmationCss);\n        Assert.Contains("justify-content: space-between", confirmationCss);\n        Assert.Contains("justify-content: flex-end", confirmationCss);')
          test = test.replace(
              '        Assert.DoesNotContain("<strong>@pending.PlayerName</strong>", page);',
              '        Assert.DoesNotContain("<strong>@pending.PlayerName</strong>", page);\n        Assert.Contains("<header class=\\\"player-achievement-history-pending-header\\\">", page);\n        Assert.Contains("<p class=\\\"player-achievement-history-pending-description\\\">", page);')
          test_path.write_text(test)

      - name: Build Web
        run: dotnet build src/BadWolfQuiz.Web/BadWolfQuiz.Web.csproj --configuration Release

      - name: Run Web tests
        run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj --configuration Release

      - name: Check whitespace
        run: git diff --check

      - name: Commit fix
        run: |
          git config user.name "Vitalii Hanych"
          git config user.email "64318287+VitoMilanese@users.noreply.github.com"
          git add src/BadWolfQuiz.Web/Pages/Admin/Games/PlayerAchievements.cshtml \
                  src/BadWolfQuiz.Web/wwwroot/css/player-achievement-history.css \
                  src/BadWolfQuiz.Web/wwwroot/css/player-achievement-history-confirmation.css \
                  tests/BadWolfQuiz.Web.Tests/PlayerAchievementHistoryUiRegressionTests.cs
          git commit -m "Restore pending achievement side rail layout"
          git push origin HEAD:feature/625-manual-achievement-history-confirmation
