name: Temporary 625 Windows line-ending validation

on:
  push:
    branches:
      - feature/625-manual-achievement-history-confirmation

jobs:
  validate:
    if: github.event.head_commit.message == 'Add temporary Windows line-ending validation'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run failing regression test on Windows
        run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj --configuration Release --filter "FullyQualifiedName~PlayerAchievementHistoryUiRegressionTests.Host_tools_and_history_page_are_wired_without_replacing_the_existing_player_dialog_endpoint"
      - name: Check whitespace
        run: git diff --check origin/main...HEAD
