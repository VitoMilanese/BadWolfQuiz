name: Free-selection hint flicker validation

on:
  pull_request:

jobs:
  web-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Check question search JavaScript
        run: node --check src/BadWolfQuiz.Web/wwwroot/js/minigames-question-search.js
      - name: Run web tests
        run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj --configuration Release
