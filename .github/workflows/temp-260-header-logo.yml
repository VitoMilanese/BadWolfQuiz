name: Temp #260 header logo navigation

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj -c Release --filter FullyQualifiedName~ContentEditorResetRegressionTests
      - run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj -c Release --filter FullyQualifiedName~NoveltyLocalizationTests
      - run: dotnet build src/BadWolfQuiz.Web/BadWolfQuiz.Web.csproj -c Release
      - run: git diff --check
