name: Temporary issue 621 AJAX verification

on:
  push:
    branches:
      - feature/621-player-achievement-history
    paths:
      - .github/workflows/temp-621-ajax-verify.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Diff check
        run: git diff --check origin/main...HEAD
      - name: Check achievement history JavaScript
        run: node --check src/BadWolfQuiz.Web/wwwroot/js/player-achievement-history.js
      - name: Build web
        run: dotnet build src/BadWolfQuiz.Web/BadWolfQuiz.Web.csproj --configuration Release
      - name: Test web
        run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj --configuration Release
