name: Issue 622 implementation

on:
  push:
    branches:
      - fix/622-achievement-history-adoption

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply issue 622 implementation
        run: python3 .github/issue622_impl.py

      - name: Install dotnet-ef
        run: dotnet tool install dotnet-ef --version 8.0.29 --tool-path ./.tools

      - name: Generate EF migration
        run: ./.tools/dotnet-ef migrations add AddAchievementHistoryEligibility --project src/BadWolfQuiz.Web/BadWolfQuiz.Web.csproj --context QuizDbContext --configuration Release

      - name: Build Web
        run: dotnet build src/BadWolfQuiz.Web/BadWolfQuiz.Web.csproj --configuration Release

      - name: Test Game
        run: dotnet test tests/BadWolfQuiz.Game.Tests/BadWolfQuiz.Game.Tests.csproj --configuration Release

      - name: Test Web
        run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj --configuration Release

      - name: Validate diff
        run: git diff --check

      - name: Commit verified implementation
        run: |
          rm -f .github/workflows/issue622.yml .github/issue622_impl.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden achievement history adoption"
          git push origin "HEAD:${GITHUB_REF_NAME}"
