name: Temporary Word Rings interaction patch v11

on:
  push:
    branches:
      - tmp/patch-678-action-card-fixes-v11

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/678-word-rings-action-cards
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply interaction fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrence(s), found {found}: {old[:120]!r}")
              text = text.replace(old, new, count)
              p.write_text(text, encoding='utf-8')

          css = 'src/BadWolfQuiz.Web/wwwroot/css/word-rings-action-cards-v2.css'
          rep(css,
              '''.word-rings-action-enable {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
}

.word-rings-action-enable input {
    flex: 0 0 auto;
}''',
              '''.word-rings-action-enable {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    align-items: center;
    gap: 8px;
    width: 100%;
    min-width: 0;
    cursor: pointer;
}

.word-rings-action-enable input {
    width: auto !important;
    min-width: 0 !important;
    min-height: auto !important;
    margin: 0;
}

.word-rings-action-enable span {
    min-width: 0;
    overflow-wrap: anywhere;
}''')
          rep(css,
              '''    box-sizing: border-box;
    width: 100%;
    min-height: 36px;''',
              '''    box-sizing: border-box;
    width: 100%;
    min-width: 0;
    min-height: 36px;''')
          rep(css,
              '''.word-rings-action-settings-dialog {
    width: min(92vw, 520px);
}

.word-rings-action-settings-card {
    display: grid;
    gap: 14px;
    padding: 18px;
}''',
              '''.word-rings-action-settings-dialog {
    width: min(92vw, 520px);
    max-width: calc(100vw - 20px);
    overflow-x: hidden;
}

.word-rings-action-settings-card {
    box-sizing: border-box;
    display: grid;
    gap: 14px;
    width: 100%;
    min-width: 0;
    max-width: 100%;
    padding: 18px;
}

.word-rings-action-settings-card .word-rings-action-config,
.word-rings-action-settings-card .word-rings-action-config-fields,
.word-rings-action-settings-card .word-rings-action-config-fields label {
    min-width: 0;
    max-width: 100%;
}''')

          action_js = 'src/BadWolfQuiz.Web/wwwroot/js/word-rings-action-cards-v2.js'
          rep(action_js,
              "['Mask', 'Hide some letters in the selected player’s words for one attempt.'],",
              "['Mask', 'Hide some letters in the selected player’s visible words until each affected word is checked.'],")
          rep(action_js,
              "['Anagram', 'Shuffle letters in the selected player’s words for one attempt.'],",
              "['Anagram', 'Shuffle letters in the selected player’s visible words until each affected word is checked.'],")
          rep(action_js,
              "['Маскування', 'Приховати частину літер у словах обраного гравця на одну спробу.'],",
              "['Маскування', 'Приховати частину літер у видимих словах обраного гравця, доки кожне з них не буде перевірене.'],")
          rep(action_js,
              "['Анаграма', 'Перемішати літери в словах обраного гравця на одну спробу.'],",
              "['Анаграма', 'Перемішати літери у видимих словах обраного гравця, доки кожне з них не буде перевірене.'],")
          rep(action_js,
              "['Mascheramento', 'Nascondi alcune lettere nelle parole del giocatore scelto per un tentativo.'],",
              "['Mascheramento', 'Nascondi alcune lettere nelle parole visibili del giocatore scelto finché ogni parola interessata non viene verificata.'],")
          rep(action_js,
              "['Anagramma', 'Mescola le lettere nelle parole del giocatore scelto per un tentativo.'],",
              "['Anagramma', 'Mescola le lettere nelle parole visibili del giocatore scelto finché ogni parola interessata non viene verificata.'],")
          rep(action_js,
              '''    let wordSyncQueued = false;
    const observer = new MutationObserver(() => {''',
              '''    root.addEventListener('wordrings:bank-rendered', () => {
        if (isSolo) return;
        syncMultiplayerVisibleWords();
        applyWordEffects();
    });

    let wordSyncQueued = false;
    const observer = new MutationObserver(() => {''')

          solo_js = 'src/BadWolfQuiz.Web/wwwroot/js/word-rings.js'
          rep(solo_js,
              '''    const visibleBankWords = () => [...wordList.querySelectorAll('.word-rings-word[data-word]')]
        .filter(token => !token.hidden);

    const replenishWordBank = () => {
        if (gameOver) return;

        while (visibleBankWords().length < maximumBankWords && queuedWords.length > 0) {
            const nextWord = queuedWords.shift();
            if (!nextWord || !expected.has(nextWord)) continue;
            createBankWord(nextWord);
        }
    };

    const trimWordBankToLimit = returnedWord => {
        let visible = visibleBankWords();
        while (visible.length > maximumBankWords) {
            const removable = [...visible]
                .reverse()
                .find(token => token.dataset.word !== returnedWord);
            if (!(removable instanceof HTMLElement)) break;

            const word = removable.dataset.word;
            removable.remove();
            if (word) queuedWords.unshift(word);
            visible = visibleBankWords();
        }
    };''',
              '''    const visibleBankWords = () => [...wordList.querySelectorAll('.word-rings-word[data-word]')]
        .filter(token => !token.hidden);
    const regularVisibleBankWords = () => visibleBankWords()
        .filter(token => !token.classList.contains('is-action-temporary-word'));

    const replenishWordBank = () => {
        if (gameOver) return;

        let guard = queuedWords.length;
        while (regularVisibleBankWords().length < maximumBankWords && queuedWords.length > 0 && guard-- > 0) {
            const nextWord = queuedWords.shift();
            if (!nextWord || !expected.has(nextWord)) continue;
            const created = createBankWord(nextWord);
            if (created) continue;

            const existing = wordList.querySelector(`.word-rings-word[data-word="${CSS.escape(nextWord)}"]`);
            if (existing?.classList.contains('is-action-temporary-word')) queuedWords.push(nextWord);
        }
    };

    const trimWordBankToLimit = returnedWord => {
        let visible = regularVisibleBankWords();
        while (visible.length > maximumBankWords) {
            const removable = [...visible]
                .reverse()
                .find(token => token.dataset.word !== returnedWord);
            if (!(removable instanceof HTMLElement)) break;

            const word = removable.dataset.word;
            removable.remove();
            if (word) queuedWords.unshift(word);
            visible = regularVisibleBankWords();
        }
    };''')

          coop_js = 'src/BadWolfQuiz.Web/wwwroot/js/word-rings-coop.js'
          rep(coop_js,
              '''    const visibleBankWords = () => [...wordList.querySelectorAll('.word-rings-word[data-word]')]
        .filter(token => !token.hidden);

    const replenishLocalBank = () => {
        while (visibleBankWords().length < maximumBankWords && localQueuedWords.length > 0) {
            createBankWord(localQueuedWords.shift());
        }
    };

    const trimLocalBank = returnedWord => {
        let visible = visibleBankWords();
        while (visible.length > maximumBankWords) {
            const removable = [...visible].reverse().find(item => item.dataset.word !== returnedWord);
            if (!(removable instanceof HTMLElement)) break;
            if (removable.dataset.word) localQueuedWords.unshift(removable.dataset.word);
            removable.remove();
            visible = visibleBankWords();
        }
    };

    const renderBank = nextState => {
        wordList.replaceChildren();
        for (const word of nextState.bankWords || []) createBankWord(word);
        localQueuedWords = [...(nextState.queuedWords || [])];
    };''',
              '''    const visibleBankWords = () => [...wordList.querySelectorAll('.word-rings-word[data-word]')]
        .filter(token => !token.hidden);
    const regularVisibleBankWords = () => visibleBankWords()
        .filter(token => !token.classList.contains('is-action-temporary-word'));

    const replenishLocalBank = () => {
        while (regularVisibleBankWords().length < maximumBankWords && localQueuedWords.length > 0) {
            createBankWord(localQueuedWords.shift());
        }
    };

    const trimLocalBank = returnedWord => {
        let visible = regularVisibleBankWords();
        while (visible.length > maximumBankWords) {
            const removable = [...visible].reverse().find(item => item.dataset.word !== returnedWord);
            if (!(removable instanceof HTMLElement)) break;
            if (removable.dataset.word) localQueuedWords.unshift(removable.dataset.word);
            removable.remove();
            visible = regularVisibleBankWords();
        }
    };

    const renderBank = nextState => {
        const preservedOverflow = new Map(
            [...wordList.querySelectorAll('.word-rings-word[data-action-overflow-word="true"]')]
                .filter(token => token instanceof HTMLButtonElement)
                .map(token => [String(token.dataset.word || '').toLocaleLowerCase(), token]));

        wordList.replaceChildren();
        for (const word of nextState.bankWords || []) {
            const key = String(word).toLocaleLowerCase();
            const preserved = preservedOverflow.get(key);
            if (preserved) {
                preservedOverflow.delete(key);
                delete preserved.dataset.actionOverflowWord;
                wordList.append(preserved);
                wireWord?.(preserved);
            } else {
                createBankWord(word);
            }
        }
        preservedOverflow.forEach(token => {
            wordList.append(token);
            wireWord?.(token);
        });
        localQueuedWords = [...(nextState.queuedWords || [])];
        root.dispatchEvent(new CustomEvent('wordrings:bank-rendered'));
    };''')

          service = 'src/BadWolfQuiz.Web/Services/WordRingsActionCardCoordinator.cs'
          rep(service,
              '''        var state = SynchronizeTurnState(roomCode, playerToken);
        var normalizedWord = word?.Trim() ?? string.Empty;
        string expectedMembership;''',
              '''        var state = SynchronizeTurnState(roomCode, playerToken);
        if (state.DedicatedHostMode)
        {
            // In host-controlled rooms the host must always judge the placement first.
            // Immunity is consumed only if the host marks the attempt as failed.
            return null;
        }

        var normalizedWord = word?.Trim() ?? string.Empty;
        string expectedMembership;''')

          tag_helper = 'src/BadWolfQuiz.Web/TagHelpers/WordRingsActionCardsAssetsTagHelper.cs'
          rep(tag_helper, 'word-rings-action-cards-v2.css?v=3', 'word-rings-action-cards-v2.css?v=4')
          rep(tag_helper, 'word-rings-action-cards-v2.js?v=3', 'word-rings-action-cards-v2.js?v=4')

          tests = 'tests/BadWolfQuiz.Web.Tests/WordRingsActionCardsRegressionTests.cs'
          rep(tests,
              '''    [Fact]
    public void Room_tuning_allows_the_host_to_raise_target_score_to_twenty()''',
              '''    [Fact]
    public void Mask_and_anagram_are_consumed_only_for_the_attempted_word()
    {
        var root = Path.Combine(Path.GetTempPath(), $"badwolf-word-rings-obfuscation-{Guid.NewGuid():N}");
        Directory.CreateDirectory(root);

        try
        {
            var environment = new TestWebHostEnvironment(root);
            var rooms = WordRingsRoomHostCoordinator.Get(environment);
            var cards = WordRingsActionCardCoordinator.Get(environment);
            var host = rooms.CreateRoom("Host", 15, partialScoreEnabled: false, hostChoosesRules: false);
            _ = rooms.JoinRoom(host.RoomCode, "Guest");
            cards.RegisterRoom(host, enabled: true, correctWordsPerCard: 2, maximumCards: 3);
            _ = rooms.StartGame(host.RoomCode, host.PlayerToken);
            cards.BeginRound(host.RoomCode, host.PlayerToken);

            var method = typeof(WordRingsActionCardCoordinator).GetMethod(
                "ApplyWordObfuscation",
                System.Reflection.BindingFlags.Instance | System.Reflection.BindingFlags.NonPublic);
            Assert.NotNull(method);

            method.Invoke(cards, [host.RoomCode, host.State.PlayerId, true]);
            var maskedBefore = cards.GetState(host.RoomCode, host.PlayerToken);
            Assert.True(maskedBefore.MaskedWords.Count >= 2);
            var maskedAttempt = maskedBefore.MaskedWords[0];
            var maskedUntouched = maskedBefore.MaskedWords[1];

            cards.RecordPlacementAttempt(host.RoomCode, host.State.PlayerId, maskedAttempt, fullyCorrect: false);
            var maskedAfter = cards.GetState(host.RoomCode, host.PlayerToken);
            Assert.DoesNotContain(maskedAfter.MaskedWords, word =>
                string.Equals(word, maskedAttempt, StringComparison.OrdinalIgnoreCase));
            Assert.Contains(maskedAfter.MaskedWords, word =>
                string.Equals(word, maskedUntouched, StringComparison.OrdinalIgnoreCase));
            Assert.Equal(maskedBefore.MaskedWords.Count - 1, maskedAfter.MaskedWords.Count);

            method.Invoke(cards, [host.RoomCode, host.State.PlayerId, false]);
            var anagramBefore = cards.GetState(host.RoomCode, host.PlayerToken);
            Assert.True(anagramBefore.AnagrammedWords.Count >= 2);
            var anagramAttempt = anagramBefore.AnagrammedWords[0];
            var anagramUntouched = anagramBefore.AnagrammedWords[1];

            cards.RecordPlacementAttempt(host.RoomCode, host.State.PlayerId, anagramAttempt, fullyCorrect: false);
            var anagramAfter = cards.GetState(host.RoomCode, host.PlayerToken);
            Assert.DoesNotContain(anagramAfter.AnagrammedWords, word =>
                string.Equals(word, anagramAttempt, StringComparison.OrdinalIgnoreCase));
            Assert.Contains(anagramAfter.AnagrammedWords, word =>
                string.Equals(word, anagramUntouched, StringComparison.OrdinalIgnoreCase));
            Assert.Equal(anagramBefore.AnagrammedWords.Count - 1, anagramAfter.AnagrammedWords.Count);
        }
        finally
        {
            Directory.Delete(root, recursive: true);
        }
    }

    [Fact]
    public void Room_tuning_allows_the_host_to_raise_target_score_to_twenty()''')
          rep(tests,
              '''        Assert.Contains("syncMultiplayerVisibleWords", script, StringComparison.Ordinal);
        Assert.Contains("lastRenderedCardSignature", script, StringComparison.Ordinal);''',
              '''        Assert.Contains("syncMultiplayerVisibleWords", script, StringComparison.Ordinal);
        Assert.Contains("wordrings:bank-rendered", script, StringComparison.Ordinal);
        Assert.Contains("lastRenderedCardSignature", script, StringComparison.Ordinal);''')
          rep(tests,
              '''        Assert.Contains("soundEffectsEnabled", coopScript, StringComparison.Ordinal);
        Assert.Contains("data-room-sound-enabled", page, StringComparison.Ordinal);''',
              '''        Assert.Contains("soundEffectsEnabled", coopScript, StringComparison.Ordinal);
        Assert.Contains("regularVisibleBankWords", coopScript, StringComparison.Ordinal);
        Assert.Contains("data-action-overflow-word=\"true\"", coopScript, StringComparison.Ordinal);
        Assert.Contains("wordrings:bank-rendered", coopScript, StringComparison.Ordinal);
        Assert.Contains("regularVisibleBankWords", soloScript, StringComparison.Ordinal);
        Assert.Contains("data-room-sound-enabled", page, StringComparison.Ordinal);''')
          rep(tests,
              '''        Assert.Contains("word-rings-sound-toggle", css, StringComparison.Ordinal);
        Assert.Contains("word-rings-room-dialog[data-create-room-dialog]", css, StringComparison.Ordinal);''',
              '''        Assert.Contains("word-rings-sound-toggle", css, StringComparison.Ordinal);
        Assert.Contains("width: auto !important;", css, StringComparison.Ordinal);
        Assert.Contains("overflow-x: hidden;", css, StringComparison.Ordinal);
        Assert.Contains("word-rings-room-dialog[data-create-room-dialog]", css, StringComparison.Ordinal);''')
          rep(tests, 'word-rings-action-cards-v2.css?v=3', 'word-rings-action-cards-v2.css?v=4')
          rep(tests, 'word-rings-action-cards-v2.js?v=3', 'word-rings-action-cards-v2.js?v=4')
          rep(tests,
              '''        Assert.Contains("return false;", service, StringComparison.Ordinal);''',
              '''        Assert.Contains("if (state.DedicatedHostMode)", service, StringComparison.Ordinal);
        Assert.Contains("return null;", service, StringComparison.Ordinal);
        Assert.Contains("return false;", service, StringComparison.Ordinal);''')
          PY

      - name: Restore Web tests
        run: dotnet restore tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj

      - name: Check JavaScript syntax
        run: |
          node --check src/BadWolfQuiz.Web/wwwroot/js/word-rings-action-cards-v2.js
          node --check src/BadWolfQuiz.Web/wwwroot/js/word-rings-coop.js
          node --check src/BadWolfQuiz.Web/wwwroot/js/word-rings.js
          node --check src/BadWolfQuiz.Web/wwwroot/js/word-rings-pointer-drag.js

      - name: Check whitespace
        run: git diff --check

      - name: Run action-card regressions
        run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj --no-restore --configuration Release --filter "FullyQualifiedName~WordRingsActionCardsRegressionTests"

      - name: Run full Web test suite
        run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj --no-restore --configuration Release

      - name: Commit and push feature fixes
        shell: bash
        run: |
          git config user.name "Vitalii Hanych"
          git config user.email "64318287+VitoMilanese@users.noreply.github.com"
          git add \
            src/BadWolfQuiz.Web/Services/WordRingsActionCardCoordinator.cs \
            src/BadWolfQuiz.Web/TagHelpers/WordRingsActionCardsAssetsTagHelper.cs \
            src/BadWolfQuiz.Web/wwwroot/css/word-rings-action-cards-v2.css \
            src/BadWolfQuiz.Web/wwwroot/js/word-rings-action-cards-v2.js \
            src/BadWolfQuiz.Web/wwwroot/js/word-rings-coop.js \
            src/BadWolfQuiz.Web/wwwroot/js/word-rings.js \
            tests/BadWolfQuiz.Web.Tests/WordRingsActionCardsRegressionTests.cs
          git diff --cached --quiet && exit 0
          git commit -m "Fix Word Rings temporary words and host effects"
          git push origin HEAD:feature/678-word-rings-action-cards
