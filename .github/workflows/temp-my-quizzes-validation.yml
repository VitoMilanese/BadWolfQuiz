name: Temporary My Quizzes validation

on:
  push:
    branches:
      - agent/redesign-my-quizzes

jobs:
  validate-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test web project
        run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj -c Release --logger "console;verbosity=minimal"
