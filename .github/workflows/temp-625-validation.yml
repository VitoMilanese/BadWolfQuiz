name: Temporary 625 validation

on:
  push:
    branches:
      - feature/625-manual-achievement-history-confirmation

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Web
        run: dotnet build src/BadWolfQuiz.Web/BadWolfQuiz.Web.csproj --configuration Release

      - name: Run Web tests
        run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj --configuration Release

      - name: Check whitespace
        run: git diff --check origin/main...HEAD
