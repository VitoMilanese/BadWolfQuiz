name: TEMP minigame resource sync validation

on:
  pull_request:

jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run Web tests
        run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj --configuration Release
      - name: Check resource sync JavaScript
        run: node --check src/BadWolfQuiz.Web/wwwroot/js/minigame-resource-sync.js
