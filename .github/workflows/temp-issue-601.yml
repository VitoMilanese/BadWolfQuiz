name: Temporary issue 601 implementation

on:
  push:
    branches:
      - feature/601-answer-reward-buttons
    paths:
      - tools/apply_issue_601.py
      - .github/workflows/temp-issue-601.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Normalize patch preconditions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          models = Path("src/BadWolfQuiz.Web/Models/QuizModels.cs")
          text = models.read_text(encoding="utf-8-sig")
          old = "    public bool ExcludeFromRandomWagerSelection { get; set; }\n    public DateTime UpdatedAtUtc { get; set; } = DateTime.UtcNow;"
          new = "    public bool ExcludeFromRandomWagerSelection { get; set; }\n\n    public DateTime UpdatedAtUtc { get; set; } = DateTime.UtcNow;"
          if text.count(old) != 1:
              raise RuntimeError("QuizQuestion formatting precondition was not found exactly once")
          models.write_text(text.replace(old, new, 1), encoding="utf-8")

          script = Path("tools/apply_issue_601.py")
          text = script.read_text(encoding="utf-8")

          old = "                        presentationType,\\n                        buzzerMode,\\n                        Math.Max(0, question.BuzzDelaySeconds)"
          new = "            presentationType,\\n            buzzerMode,\\n            Math.Max(0, question.BuzzDelaySeconds)"
          if text.count(old) != 2:
              raise RuntimeError(f"QuizSnapshotFactory indentation precondition count was {text.count(old)}, expected 2")
          text = text.replace(old, new)
          if text.count("question.BuzzDelaySeconds)))") != 1:
              raise RuntimeError("QuizSnapshotFactory closing-paren precondition was not found exactly once")
          text = text.replace("question.BuzzDelaySeconds)))", "question.BuzzDelaySeconds));", 1)
          if text.count("question.AllowAnswerRewardModifiers)))") != 1:
              raise RuntimeError("QuizSnapshotFactory replacement closing-paren precondition was not found exactly once")
          text = text.replace("question.AllowAnswerRewardModifiers)))", "question.AllowAnswerRewardModifiers);", 1)

          helper_old = '''    count = text.count(old)\n    if count != 1:\n        raise RuntimeError(f"{path}: expected one occurrence, found {count}: {old[:120]!r}")\n    write(path, text.replace(old, new, 1))\n'''
          helper_new = '''    count = text.count(old)\n    if (\n        path == "src/BadWolfQuiz.Web/Pages/Admin/Games/Lobby.cshtml"\n        and "judgment-correct-button" in old\n        and "judgment-incorrect-button" in old\n    ):\n        if count < 1:\n            raise RuntimeError(f"{path}: host judgment block was not found")\n        write(path, text.replace(old, new, 1))\n        return\n    if count != 1:\n        raise RuntimeError(f"{path}: expected one occurrence, found {count}: {old[:120]!r}")\n    write(path, text.replace(old, new, 1))\n'''
          if text.count(helper_old) != 1:
              raise RuntimeError("replace_once helper precondition was not found exactly once")
          text = text.replace(helper_old, helper_new, 1)
          script.write_text(text, encoding="utf-8")
          PY

      - name: Apply issue 601 changes
        run: python3 tools/apply_issue_601.py

      - name: Build web before migration
        run: dotnet build src/BadWolfQuiz.Web/BadWolfQuiz.Web.csproj --configuration Release

      - name: Generate EF Core migration
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.29
          ~/.dotnet/tools/dotnet-ef migrations add AddQuestionAnswerRewardModifiers \
            --project src/BadWolfQuiz.Web/BadWolfQuiz.Web.csproj \
            --startup-project src/BadWolfQuiz.Web/BadWolfQuiz.Web.csproj \
            --configuration Release \
            --no-build

      - name: Check diff formatting
        run: git diff --check

      - name: Test game engine
        run: dotnet test tests/BadWolfQuiz.Game.Tests/BadWolfQuiz.Game.Tests.csproj --configuration Release

      - name: Test web
        run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj --configuration Release

      - name: Commit validated implementation
        run: |
          rm -f tools/apply_issue_601.py .github/workflows/temp-issue-601.yml
          git config user.name "Vitalii Hanych"
          git config user.email "64318287+VitoMilanese@users.noreply.github.com"
          git add -A
          git commit -m "Add optional x2 and half answer scoring"
          git push origin HEAD:feature/601-answer-reward-buttons
