name: Agent 290 validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement-and-test:
    if: github.head_ref == 'agent/tmp-290-run'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Implement YouTube start-time parsing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lobby_path = Path("src/BadWolfQuiz.Web/Pages/Admin/Games/Lobby.cshtml.cs")
          source = lobby_path.read_text(encoding="utf-8")
          start = source.index("    public static string? GetYouTubeEmbedUrl(string? value)")
          end = source.index(
              "    public async Task<IActionResult> OnPostUpdateSettingsAsync(",
              start)

          new_method = '''    public static string? GetYouTubeEmbedUrl(string? value)
          {
              if (!Uri.TryCreate(value, UriKind.Absolute, out var uri))
              {
                  return value;
              }

              string? videoId = null;

              if (uri.Host.EndsWith("youtu.be", StringComparison.OrdinalIgnoreCase))
              {
                  videoId = uri.AbsolutePath
                      .Trim('/')
                      .Split('/', StringSplitOptions.RemoveEmptyEntries)
                      .FirstOrDefault();
              }
              else if (uri.Host.EndsWith("youtube.com", StringComparison.OrdinalIgnoreCase) ||
                       uri.Host.EndsWith("youtube-nocookie.com", StringComparison.OrdinalIgnoreCase))
              {
                  var pathSegments = uri.AbsolutePath
                      .Trim('/')
                      .Split('/', StringSplitOptions.RemoveEmptyEntries);

                  if (pathSegments.Length >= 2 &&
                      (string.Equals(pathSegments[0], "embed", StringComparison.OrdinalIgnoreCase) ||
                       string.Equals(pathSegments[0], "shorts", StringComparison.OrdinalIgnoreCase)))
                  {
                      videoId = pathSegments[1];
                  }
                  else
                  {
                      videoId = GetYouTubeUrlParameter(uri, "v");
                  }
              }

              if (string.IsNullOrWhiteSpace(videoId))
              {
                  return value;
              }

              var embedUrl =
                  $"https://www.youtube-nocookie.com/embed/{Uri.EscapeDataString(videoId)}?enablejsapi=1";
              var startSeconds = GetYouTubeStartSeconds(uri);

              return startSeconds is > 0
                  ? $"{embedUrl}&start={startSeconds.Value}"
                  : embedUrl;
          }

          private static int? GetYouTubeStartSeconds(Uri uri)
          {
              var timestamp =
                  GetYouTubeUrlParameter(uri, "start") ??
                  GetYouTubeUrlParameter(uri, "t");
              return ParseYouTubeTimestamp(timestamp);
          }

          private static string? GetYouTubeUrlParameter(Uri uri, string name)
          {
              foreach (var source in new[]
              {
                  uri.Query.TrimStart('?'),
                  uri.Fragment.TrimStart('#')
              })
              {
                  foreach (var item in source.Split(
                               '&',
                               StringSplitOptions.RemoveEmptyEntries))
                  {
                      var parts = item.Split('=', 2);
                      if (parts.Length != 2 ||
                          !string.Equals(
                              Uri.UnescapeDataString(parts[0]),
                              name,
                              StringComparison.OrdinalIgnoreCase))
                      {
                          continue;
                      }

                      return Uri.UnescapeDataString(
                          parts[1].Replace('+', ' '));
                  }
              }

              return null;
          }

          private static int? ParseYouTubeTimestamp(string? value)
          {
              if (string.IsNullOrWhiteSpace(value))
              {
                  return null;
              }

              var normalized = value.Trim().ToLowerInvariant();
              if (int.TryParse(normalized, out var seconds))
              {
                  return seconds >= 0 ? seconds : null;
              }

              long totalSeconds = 0;
              long component = 0;
              var hasComponent = false;
              var hasUnit = false;

              foreach (var character in normalized)
              {
                  if (character is >= '0' and <= '9')
                  {
                      component = component * 10 + (character - '0');
                      if (component > int.MaxValue)
                      {
                          return null;
                      }

                      hasComponent = true;
                      continue;
                  }

                  if (!hasComponent || character is not ('h' or 'm' or 's'))
                  {
                      return null;
                  }

                  totalSeconds += character switch
                  {
                      'h' => component * 60 * 60,
                      'm' => component * 60,
                      _ => component
                  };
                  if (totalSeconds > int.MaxValue)
                  {
                      return null;
                  }

                  component = 0;
                  hasComponent = false;
                  hasUnit = true;
              }

              if (hasComponent)
              {
                  if (!hasUnit)
                  {
                      return null;
                  }

                  totalSeconds += component;
              }

              return hasUnit && totalSeconds <= int.MaxValue
                  ? (int)totalSeconds
                  : null;
          }

'''

          lobby_path.write_text(
              source[:start] + new_method + source[end:],
              encoding="utf-8")

          test_path = Path("tests/BadWolfQuiz.Web.Tests/YouTubeEmbedUrlTests.cs")
          test_path.write_text('''using BadWolfQuiz.Web.Pages.Admin.Games;

namespace BadWolfQuiz.Web.Tests;

public sealed class YouTubeEmbedUrlTests
{
    [Theory]
    [InlineData(
        "https://youtu.be/E387SU9WhWc?t=898",
        "https://www.youtube-nocookie.com/embed/E387SU9WhWc?enablejsapi=1&start=898")]
    [InlineData(
        "https://www.youtube.com/watch?v=E387SU9WhWc&t=898",
        "https://www.youtube-nocookie.com/embed/E387SU9WhWc?enablejsapi=1&start=898")]
    [InlineData(
        "https://www.youtube.com/watch?v=E387SU9WhWc&start=898",
        "https://www.youtube-nocookie.com/embed/E387SU9WhWc?enablejsapi=1&start=898")]
    [InlineData(
        "https://www.youtube.com/embed/E387SU9WhWc?start=898",
        "https://www.youtube-nocookie.com/embed/E387SU9WhWc?enablejsapi=1&start=898")]
    [InlineData(
        "https://youtu.be/E387SU9WhWc?t=14m58s",
        "https://www.youtube-nocookie.com/embed/E387SU9WhWc?enablejsapi=1&start=898")]
    [InlineData(
        "https://www.youtube.com/watch?v=E387SU9WhWc#t=898s",
        "https://www.youtube-nocookie.com/embed/E387SU9WhWc?enablejsapi=1&start=898")]
    public void Timestamp_is_converted_to_embed_start_parameter(
        string source,
        string expected)
    {
        Assert.Equal(expected, LobbyModel.GetYouTubeEmbedUrl(source));
    }

    [Theory]
    [InlineData(
        "https://youtu.be/E387SU9WhWc",
        "https://www.youtube-nocookie.com/embed/E387SU9WhWc?enablejsapi=1")]
    [InlineData(
        "https://www.youtube.com/watch?v=E387SU9WhWc",
        "https://www.youtube-nocookie.com/embed/E387SU9WhWc?enablejsapi=1")]
    [InlineData(
        "https://www.youtube.com/shorts/E387SU9WhWc",
        "https://www.youtube-nocookie.com/embed/E387SU9WhWc?enablejsapi=1")]
    [InlineData(
        "https://www.youtube.com/embed/E387SU9WhWc",
        "https://www.youtube-nocookie.com/embed/E387SU9WhWc?enablejsapi=1")]
    public void Existing_formats_without_timestamp_still_start_from_beginning(
        string source,
        string expected)
    {
        Assert.Equal(expected, LobbyModel.GetYouTubeEmbedUrl(source));
    }

    [Fact]
    public void Invalid_timestamp_is_ignored()
    {
        const string source =
            "https://youtu.be/E387SU9WhWc?t=not-a-time";

        Assert.Equal(
            "https://www.youtube-nocookie.com/embed/E387SU9WhWc?enablejsapi=1",
            LobbyModel.GetYouTubeEmbedUrl(source));
    }
}
''', encoding="utf-8")
          PY

      - name: Check diff
        run: git diff --check

      - name: Run focused tests
        run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj --filter "FullyQualifiedName~YouTubeEmbedUrlTests"

      - name: Commit implementation to temporary branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/BadWolfQuiz.Web/Pages/Admin/Games/Lobby.cshtml.cs tests/BadWolfQuiz.Web.Tests/YouTubeEmbedUrlTests.cs
          git commit -m "Implement YouTube start-time parsing (#290)"
          git push origin HEAD:${{ github.head_ref }}
