name: temp-word-rings-coop-placement-runner

on:
  push:
    branches:
      - feature/666-word-rings-minigame

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Apply embedded patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/temp-word-rings-coop-placement-fixes.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(script, 'embedded-word-rings-fix.py', 'exec'))
          PY
      - name: JavaScript syntax checks
        run: |
          node --check src/BadWolfQuiz.Web/wwwroot/js/word-rings.js
          node --check src/BadWolfQuiz.Web/wwwroot/js/word-rings-pointer-drag.js
          node --check src/BadWolfQuiz.Web/wwwroot/js/word-rings-end-dialog.js
          node --check src/BadWolfQuiz.Web/wwwroot/js/word-rings-room-entry.js
          node --check src/BadWolfQuiz.Web/wwwroot/js/word-rings-coop.js
      - name: Restore
        run: dotnet restore tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj
      - name: Tests
        run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj -c Release --no-restore --logger "console;verbosity=minimal"
      - name: Commit validated clean tree
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/temp-word-rings-coop-placement-fixes.yml .github/workflows/temp-word-rings-coop-placement-runner.yml
          git config user.name "Vitalii Hanych"
          git config user.email "64318287+VitoMilanese@users.noreply.github.com"
          git add src/BadWolfQuiz.Web tests/BadWolfQuiz.Web.Tests
          git commit -m "Fix cooperative placement feedback and room replacement"
          git push origin HEAD:feature/666-word-rings-minigame
