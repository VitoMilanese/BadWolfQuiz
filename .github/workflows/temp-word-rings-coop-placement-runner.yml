name: temp-word-rings-coop-placement-runner

on:
  push:
    branches:
      - feature/666-word-rings-minigame

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Apply embedded patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/temp-word-rings-coop-placement-fixes.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(script, 'embedded-word-rings-fix.py', 'exec'))
          PY
      - name: Fix regression string literals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/BadWolfQuiz.Web.Tests/WordRingsCooperativeRoomRegressionTests.cs')
          text = path.read_text(encoding='utf-8')
          text = text.replace('Assert.Contains("content: "✓"", refinements, StringComparison.Ordinal);', r'Assert.Contains("content: \"✓\"", refinements, StringComparison.Ordinal);')
          text = text.replace('Assert.Contains("content: "×"", refinements, StringComparison.Ordinal);', r'Assert.Contains("content: \"×\"", refinements, StringComparison.Ordinal);')
          text = text.replace('Assert.Contains("content: "½"", styles, StringComparison.Ordinal);', r'Assert.Contains("content: \"½\"", styles, StringComparison.Ordinal);')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Fix API regression null assertion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/BadWolfQuiz.Web.Tests/WordRingsCooperativeRoomRegressionTests.cs')
          text = path.read_text(encoding='utf-8')
          old = '''            var payload = Assert.NotNull(json.Value);
                      var resultProperty = Assert.NotNull(payload.GetType().GetProperty("result"));
                      var result = Assert.IsType<WordRingsRoomPlacementResult>(resultProperty.GetValue(payload));'''
          new = '''            Assert.NotNull(json.Value);
                      var payload = json.Value!;
                      var resultProperty = payload.GetType().GetProperty("result");
                      Assert.NotNull(resultProperty);
                      var result = Assert.IsType<WordRingsRoomPlacementResult>(resultProperty!.GetValue(payload));'''
          if old not in text:
              raise SystemExit('Expected API assertion block was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: JavaScript syntax checks
        run: |
          node --check src/BadWolfQuiz.Web/wwwroot/js/word-rings.js
          node --check src/BadWolfQuiz.Web/wwwroot/js/word-rings-pointer-drag.js
          node --check src/BadWolfQuiz.Web/wwwroot/js/word-rings-end-dialog.js
          node --check src/BadWolfQuiz.Web/wwwroot/js/word-rings-room-entry.js
          node --check src/BadWolfQuiz.Web/wwwroot/js/word-rings-coop.js
      - name: Restore
        run: dotnet restore tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj
      - name: Tests
        run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj -c Release --no-restore --logger "console;verbosity=minimal"
      - name: Commit validated clean tree
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/temp-word-rings-coop-placement-fixes.yml .github/workflows/temp-word-rings-coop-placement-runner.yml
          git config user.name "Vitalii Hanych"
          git config user.email "64318287+VitoMilanese@users.noreply.github.com"
          git add src/BadWolfQuiz.Web tests/BadWolfQuiz.Web.Tests
          git commit -m "Fix cooperative placement feedback and room replacement"
          git push origin HEAD:feature/666-word-rings-minigame
