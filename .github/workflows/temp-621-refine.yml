name: Temporary issue 621 UI refinement

on:
  push:
    branches:
      - feature/621-player-achievement-history
    paths:
      - .github/workflows/temp-621-refine.yml

permissions:
  contents: write

jobs:
  refine-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply history page refinements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8-sig")
              if old not in text:
                  raise SystemExit(f"Anchor not found in {path}: {old[:160]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

