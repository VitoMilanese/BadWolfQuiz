name: Temporary issue 621 UI refinement

on:
  push:
    branches:
      - feature/621-player-achievement-history
    paths:
      - .github/workflows/temp-621-refine.yml

permissions:
  contents: write

jobs:
  refine-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply history page refinements
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/temp-621-refine.py
          git diff --check

      - name: Build web
        run: dotnet build src/BadWolfQuiz.Web/BadWolfQuiz.Web.csproj --configuration Release

      - name: Test game
        run: dotnet test tests/BadWolfQuiz.Game.Tests/BadWolfQuiz.Game.Tests.csproj --configuration Release

      - name: Test web
        run: dotnet test tests/BadWolfQuiz.Web.Tests/BadWolfQuiz.Web.Tests.csproj --configuration Release

      - name: Commit refinements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/features/player-achievements.md \
            src/BadWolfQuiz.Web/Pages/Admin/Games/Lobby.cshtml \
            src/BadWolfQuiz.Web/Pages/Admin/Games/PlayerAchievements.cshtml \
            src/BadWolfQuiz.Web/Pages/Shared/_Layout.cshtml \
            src/BadWolfQuiz.Web/wwwroot/css/player-achievement-history.css \
            src/BadWolfQuiz.Web/wwwroot/js/player-achievement-history.js \
            tests/BadWolfQuiz.Web.Tests/PlayerAchievementHistoryUiRegressionTests.cs
          git commit -m "Refine player achievement history layout"
          git push origin HEAD:feature/621-player-achievement-history
