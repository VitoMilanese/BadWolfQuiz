          docs_old = '''The history page never calls achievement evaluation or unlock logic. It reads `PlayerAchievements` with no tracking, excludes internal progress-helper rows, refreshes from persistence on every request, and remains available while the game is running. Player selection limits the full-history view to one current player at a time and the result list uses a bounded scrolling region so large histories do not make the host UI unusable. Unknown non-internal achievement codes remain displayable with fallback presentation so future host-defined achievements can plug their own metadata/artwork into the same history surface.'''
          docs_new = '''The history page never calls achievement evaluation or unlock logic. It reads `PlayerAchievements` with no tracking, excludes internal progress-helper rows, refreshes from persistence on every request, and remains available while the game is running. Player selection limits the full-history view to one current player at a time. The page uses the browser/page scroll rather than a nested result-list scrollbar, expands to a wider desktop layout, shows larger achievement artwork, centers the history-mode controls, and moves the player selector into a side rail when enough width is available. On narrower screens the selector returns above the history list. `Escape` returns the host directly to the game, and opening/closing or switching the history views uses the shared `BadWolfBusy` navigation overlay when it is available. Unknown non-internal achievement codes remain displayable with fallback presentation so future host-defined achievements can plug their own metadata/artwork into the same history surface.'''
